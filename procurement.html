<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="E.Z רכש">
<meta name="theme-color" content="#0a0e1a">
<title>E.Z — מערכת רכש</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;600;700;800;900&family=Rubik:wght@400;500;600;700&display=swap');
:root{
  --bg:#0a0e1a;--bg2:#111827;--bg3:#1e2538;--bg4:#2a3348;
  --border:#2e3650;--border2:#3a4568;
  --text:#eef0f6;--text2:#94a3c0;--text3:#5e6b85;
  --accent:#2d7ff9;--accent2:#1a6be6;--accent-soft:rgba(45,127,249,0.12);
  --green:#10b981;--green-soft:rgba(16,185,129,0.12);
  --orange:#f59e0b;--orange-soft:rgba(245,158,11,0.12);
  --red:#ef4444;--red-soft:rgba(239,68,68,0.12);
  --purple:#8b5cf6;--purple-soft:rgba(139,92,246,0.12);
  --r:10px;--r2:14px;
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Heebo',sans-serif;background:var(--bg);color:var(--text);direction:rtl;min-height:100vh;-webkit-font-smoothing:antialiased}
::-webkit-scrollbar{width:5px}::-webkit-scrollbar-thumb{background:var(--bg4);border-radius:3px}

/* AUTH SCREEN */
.auth-screen{display:flex;align-items:center;justify-content:center;min-height:100vh;padding:20px;
  background:linear-gradient(135deg,#0a0e1a 0%,#111827 50%,#0f172a 100%)}
.auth-card{background:var(--bg2);border:1px solid var(--border);border-radius:20px;padding:40px 36px;width:100%;max-width:380px;text-align:center;
  box-shadow:0 20px 60px rgba(0,0,0,0.4)}
.auth-logo{width:100px;height:auto;margin-bottom:20px;border-radius:12px}
.auth-card h1{font-size:24px;font-weight:800;margin-bottom:6px;color:var(--text)}
.auth-card p{color:var(--text2);font-size:14px;margin-bottom:28px;line-height:1.6}
.auth-btn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;padding:14px;
  background:#fff;color:#333;border:none;border-radius:var(--r);font-family:inherit;font-size:15px;font-weight:600;cursor:pointer;transition:all 0.2s}
.auth-btn:hover{box-shadow:0 4px 20px rgba(255,255,255,0.15);transform:translateY(-1px)}
.auth-btn img{width:20px;height:20px}
.auth-error{color:var(--red);font-size:13px;margin-top:16px;display:none;padding:10px;background:var(--red-soft);border-radius:var(--r)}

/* APP */
.app{display:none;min-height:100vh;padding-bottom:68px}
.app-header{display:flex;align-items:center;gap:12px;padding:12px 16px;background:var(--bg2);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:50}
.app-logo{width:36px;height:36px;border-radius:8px}
.app-title{font-size:16px;font-weight:700;flex:1}
.app-user{font-size:12px;color:var(--text2);text-align:left}
.app-user b{color:var(--text);font-size:13px}
.hdr-btn{background:none;border:1px solid var(--border);color:var(--text2);padding:6px 12px;border-radius:var(--r);font-size:12px;font-family:inherit;cursor:pointer}
.hdr-btn:hover{border-color:var(--text2);color:var(--text)}
.hdr-dot{width:8px;height:8px;border-radius:50%;display:inline-block;margin-left:4px}
.dot-g{background:var(--green)}.dot-r{background:var(--red)}

/* MAIN */
.main-content{padding:16px;max-width:900px;margin:0 auto}

/* BOTTOM NAV */
.bottom-nav{position:fixed;bottom:0;left:0;right:0;background:var(--bg2);border-top:1px solid var(--border);
  display:flex;justify-content:space-around;padding:6px 0 env(safe-area-inset-bottom,6px);z-index:100}
.bnav{display:flex;flex-direction:column;align-items:center;gap:2px;padding:4px 2px;color:var(--text3);
  font-size:10px;cursor:pointer;flex:1;-webkit-tap-highlight-color:transparent;transition:color 0.15s}
.bnav.active{color:var(--accent)}
.bnav .bi{font-size:20px}
.bnav-badge{background:var(--red);color:#fff;font-size:9px;padding:1px 5px;border-radius:8px;position:absolute;top:-2px;right:calc(50% - 16px)}

/* CARDS */
.card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--r2);padding:20px;margin-bottom:14px}
.card-sm{padding:14px}
.card-title{font-size:15px;font-weight:700;margin-bottom:12px;display:flex;align-items:center;justify-content:space-between}
.card-title .sub{font-size:12px;color:var(--text2);font-weight:400}

/* STATS */
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.stat{background:var(--bg2);border:1px solid var(--border);border-radius:var(--r2);padding:14px;text-align:center}
.stat-val{font-size:24px;font-weight:800;font-family:'Rubik',sans-serif}
.stat-lbl{font-size:11px;color:var(--text2);margin-top:2px}
.stat.blue .stat-val{color:var(--accent)}.stat.green .stat-val{color:var(--green)}
.stat.orange .stat-val{color:var(--orange)}.stat.red .stat-val{color:var(--red)}

/* FILTERS */
.filters{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap}
.filters select{flex:1;min-width:0;padding:10px 12px;background:var(--bg3);border:1px solid var(--border);
  border-radius:var(--r);color:var(--text);font-size:14px;font-family:inherit}
.filters select:focus{outline:none;border-color:var(--accent)}

/* PROGRESS */
.prog{height:6px;background:var(--bg4);border-radius:3px;overflow:hidden;margin-top:4px}
.prog-fill{height:100%;border-radius:3px;transition:width 0.4s}

/* BUDGET ROWS */
.brow{display:flex;flex-wrap:wrap;gap:4px 16px;padding:12px 0;border-bottom:1px solid var(--border);font-size:13px;align-items:center}
.brow:last-child{border:none}
.brow-name{font-weight:600;width:100%;margin-bottom:4px;font-size:14px}
.brow-item{display:flex;flex-direction:column;align-items:center;min-width:60px}
.brow-item .v{font-weight:700;font-size:14px}.brow-item .l{font-size:10px;color:var(--text3)}

/* TABLE */
.tbl{width:100%;font-size:13px;border-collapse:collapse}
.tbl th{text-align:right;padding:8px;color:var(--text3);font-size:11px;font-weight:500;border-bottom:1px solid var(--border)}
.tbl td{padding:8px;border-bottom:1px solid var(--border)}

/* BADGES */
.badge{display:inline-block;padding:3px 8px;border-radius:6px;font-size:11px;font-weight:600}
.b-pending{background:var(--orange-soft);color:var(--orange)}
.b-approved{background:var(--green-soft);color:var(--green)}
.b-rejected{background:var(--red-soft);color:var(--red)}

/* FORMS */
.fg{margin-bottom:14px}
.fg label{display:block;font-size:12px;color:var(--text2);margin-bottom:4px;font-weight:500}
.fg select,.fg input,.fg textarea{width:100%;padding:10px 12px;background:var(--bg3);border:1px solid var(--border);
  border-radius:var(--r);color:var(--text);font-size:14px;font-family:inherit}
.fg select:focus,.fg input:focus{outline:none;border-color:var(--accent)}
.frow{display:grid;grid-template-columns:1fr 1fr;gap:10px}

/* BUTTONS */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:10px 20px;border:none;
  border-radius:var(--r);font-family:inherit;font-size:14px;font-weight:600;cursor:pointer;transition:all 0.15s;width:100%}
.btn-p{background:var(--accent);color:#fff}.btn-p:hover{background:var(--accent2)}
.btn-g{background:var(--green);color:#fff}
.btn-d{background:var(--red);color:#fff}
.btn-o{background:none;color:var(--text2);border:1px solid var(--border)}.btn-o:hover{color:var(--text);border-color:var(--text2)}
.btn-s{padding:7px 14px;font-size:12px}
.btn-row{display:flex;gap:8px;margin-top:12px}

/* MODAL */
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,0.7);z-index:200;display:flex;align-items:center;justify-content:center;padding:12px;
  backdrop-filter:blur(4px);opacity:0;pointer-events:none;transition:opacity 0.2s}
.modal-bg.show{opacity:1;pointer-events:all}
.modal-box{background:var(--bg2);border:1px solid var(--border);border-radius:16px;width:100%;max-width:600px;max-height:85vh;overflow-y:auto;padding:20px}
.modal-box h3{font-size:18px;font-weight:700;margin-bottom:14px}

/* ORDER ITEM */
.oi{background:var(--bg3);border-radius:var(--r);padding:12px;margin-bottom:8px}
.oi-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.oi-top b{font-size:14px}
.oi-meta{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--text2)}

/* TOAST */
.toast-c{position:fixed;top:12px;left:12px;right:12px;z-index:9999;display:flex;flex-direction:column;align-items:center;gap:6px}
.toast{padding:12px 20px;border-radius:var(--r);font-size:13px;font-weight:500;animation:tIn 0.3s;max-width:400px;width:100%;text-align:center}
.t-ok{background:var(--green);color:#fff}.t-err{background:var(--red);color:#fff}.t-info{background:var(--accent);color:#fff}
@keyframes tIn{from{transform:translateY(-20px);opacity:0}to{transform:translateY(0);opacity:1}}

.loading{position:fixed;inset:0;background:rgba(10,14,26,0.85);z-index:300;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:12px}
.spinner{width:32px;height:32px;border:3px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:sp 0.6s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}

.debug-p{background:var(--bg3);border:1px solid var(--border);border-radius:var(--r);padding:10px;font-size:11px;color:var(--text2);
  max-height:200px;overflow-y:auto;font-family:monospace;direction:ltr;text-align:left;white-space:pre-wrap;word-break:break-all;margin:8px 0}

.empty{text-align:center;padding:40px 16px;color:var(--text3)}
.empty .ei{font-size:40px;margin-bottom:8px}

@media(min-width:768px){
  .stats{grid-template-columns:repeat(4,1fr)}
  .frow{grid-template-columns:1fr 1fr}
  .main-content{padding:24px}
}
</style>
</head>

<script>
// ============================================================
// CONFIG
// ============================================================
const CFG={
  SID:'1Xwbi3PlN2K9FfJea0sKC3pOk5XHxWVhe5KOuqkY5-yA',
  CID:'178709560097-9eur0mu87mfu762qpe8e8ibu9h08vvqc.apps.googleusercontent.com',
  KEY:'AIzaSyDePcH0mMB90U06NgjG6ywRelTvMMCn1Og',
  SCOPES:'https://www.googleapis.com/auth/spreadsheets',
  VAT:0.18,
  SH:{SUP:'ספקים',PROD:'מוצרים',BUD:'תקציב',ORD:'הזמנות רכש',APP:'הזמנות מאושרות',USERS:'משתמשים'}
};

const ORD_H=['מספר הזמנה','תאריך','ספק','פרויקט','תחום','תת תחום','יוצר','סטטוס','מקט','תיאור מוצר','כמות','מחיר ליחידה','סהכ שורה','סהכ הזמנה לפני מעמ','מעמ','סהכ הזמנה כולל מעמ','הערות'];
const APP_H=[...ORD_H,'מאשר','תאריך אישור'];

// ============================================================
// STATE
// ============================================================
let S={
  user:null, page:'dashboard', gAuth:false, gToken:null,
  data:{suppliers:[],products:[],budget:[],projects:[],orders:[],approvedOrders:[],
    suppH:[],prodH:[],budH:[],users:[]},
  selectedProject:'', dbg:[]
};

function log(m){console.log('[EZ]',m);S.dbg.push('['+new Date().toLocaleTimeString('he-IL')+'] '+m);if(S.dbg.length>150)S.dbg.shift();}

// PERSISTENCE
function save(){try{localStorage.setItem('ez5',JSON.stringify({data:S.data,gToken:S.gToken}));}catch(e){}}
function load(){try{const s=JSON.parse(localStorage.getItem('ez5'));if(s){if(s.data)S.data={...S.data,...s.data};S.gToken=s.gToken;}}catch(e){}}
function getLO(){try{return JSON.parse(localStorage.getItem('ez_lo'))||[];}catch(e){return[];}}
function saveLO(o){localStorage.setItem('ez_lo',JSON.stringify(o));}
function getLA(){try{return JSON.parse(localStorage.getItem('ez_la'))||[];}catch(e){return[];}}
function saveLA(o){localStorage.setItem('ez_la',JSON.stringify(o));}
function getDeleted(){try{return JSON.parse(localStorage.getItem('ez_del'))||[];}catch(e){return[];}}

// ============================================================
// GOOGLE AUTH — email-based, no passwords
// ============================================================
function googleLogin(){
  const r=window.location.origin+window.location.pathname;
  window.location.href=`https://accounts.google.com/o/oauth2/v2/auth?client_id=${CFG.CID}&redirect_uri=${encodeURIComponent(r)}&response_type=token&scope=${encodeURIComponent(CFG.SCOPES+' https://www.googleapis.com/auth/userinfo.email https://www.googleapis.com/auth/userinfo.profile')}&prompt=select_account`;
}

function checkOAuth(){
  const h=window.location.hash;
  if(h.includes('access_token')){
    const p=new URLSearchParams(h.substring(1));
    const t=p.get('access_token');
    if(t){S.gToken=t;S.gAuth=true;save();window.history.replaceState(null,'',window.location.pathname);
      fetchGoogleUser(t);}
  }
}

async function fetchGoogleUser(token){
  try{
    const r=await fetch('https://www.googleapis.com/oauth2/v2/userinfo',{headers:{'Authorization':'Bearer '+token}});
    if(r.ok){
      const u=await r.json();
      log('Google user: '+u.email);
      localStorage.setItem('ez_gemail',u.email);
      localStorage.setItem('ez_gname',u.name||'');
      tryLogin(u.email,u.name||u.email);
    }
  }catch(e){log('User info error: '+e.message);}
}

async function ensureAuth(){
  if(!S.gToken){S.gAuth=false;return false;}
  try{const r=await fetch('https://www.googleapis.com/oauth2/v1/tokeninfo?access_token='+S.gToken);
    if(r.ok){S.gAuth=true;return true;}}catch(e){}
  S.gToken=null;S.gAuth=false;save();return false;
}

async function tryLogin(email,name){
  // First, try to load users from Sheets directly
  try{
    const uR=await shRead(CFG.SH.USERS).catch(()=>[]);
    if(uR.length>1){
      const hdr=uR[0].map(h=>(h||'').trim());
      const rows=uR.slice(1).map(r=>{const o={};hdr.forEach((h,i)=>{o[h]=(r[i]||'').trim();});return o;});
      S.data.users=rows.map(r=>({
        email:r['מייל']||r['email']||'',
        name:r['שם']||r['name']||'',
        role:r['תפקיד']||r['role']||'viewer',
        projects:Object.entries(r).filter(([k,v])=>k.includes('פרויקט')&&v&&v!=='הכל').map(([k,v])=>v.trim()).filter(Boolean),
        allProjects:Object.values(r).some(v=>v==='הכל')
      })).filter(x=>x.email);
      localStorage.setItem('ez_users',JSON.stringify(S.data.users));
      log('Users loaded: '+S.data.users.map(u=>u.email).join(', '));
    }
  }catch(e){log('Users read err: '+e.message);}

  // Fallback to cached users
  let users=S.data.users||[];
  if(!users.length){try{users=JSON.parse(localStorage.getItem('ez_users'))||[];}catch(e){}}
  
  const found=users.find(u=>(u.email||'').toLowerCase()===email.toLowerCase());
  if(found){
    S.user={...found,googleName:name,googleEmail:email};
    localStorage.setItem('ez_session',JSON.stringify(S.user));
    showApp();
  } else {
    const err=document.getElementById('authErr');
    err.style.display='block';
    err.textContent='המייל '+email+' לא מורשה. פנו למנהל המערכת.';
    log('Unauthorized: '+email+' | Known emails: '+users.map(u=>u.email).join(', '));
  }
}

function handleGoogle(){
  openModal(`<h3>🔗 חשבון Google</h3>
    <p style="color:var(--text2);margin-bottom:12px">${S.gAuth?'✅ מחובר':'🔴 לא מחובר'}</p>
    <div class="btn-row" style="flex-direction:column">
      <button class="btn btn-p" onclick="closeModal();googleLogin()">${S.gAuth?'החלף חשבון':'התחבר'}</button>
      ${S.gAuth?'<button class="btn btn-d" onclick="S.gToken=null;S.gAuth=false;save();closeModal();toast(\'מנותק\',\'info\');updateHeader()">התנתק מ-Google</button>':''}
      <button class="btn btn-o" onclick="closeModal()">סגור</button>
    </div>`);
}

function doLogout(){
  S.user=null;localStorage.removeItem('ez_session');
  document.getElementById('appPage').style.display='none';
  document.getElementById('authPage').style.display='flex';
}

// ============================================================
// SHEETS API
// ============================================================
async function shRead(name){
  const url=`https://sheets.googleapis.com/v4/spreadsheets/${CFG.SID}/values/${encodeURIComponent("'"+name+"'")}?key=${CFG.KEY}`;
  const r=await fetch(url);if(!r.ok)throw new Error('קריאה נכשלה: '+name);
  return(await r.json()).values||[];
}

async function shWrite(name,values){
  if(!S.gToken)throw new Error('לא מחובר ל-Google');
  const url=`https://sheets.googleapis.com/v4/spreadsheets/${CFG.SID}/values/${encodeURIComponent("'"+name+"'!A1")}:append?valueInputOption=USER_ENTERED&insertDataOption=INSERT_ROWS`;
  const r=await fetch(url,{method:'POST',headers:{'Authorization':'Bearer '+S.gToken,'Content-Type':'application/json'},body:JSON.stringify({values})});
  if(!r.ok){const e=await r.json().catch(()=>({}));
    if(r.status===401){S.gToken=null;S.gAuth=false;save();throw new Error('פג תוקף — התחברו מחדש');}
    if(r.status===403)throw new Error('אין הרשאת עריכה לגיליון');
    throw new Error(e?.error?.message||'כתיבה נכשלה');}
  return await r.json();
}

async function shUpdate(name,range,values){
  if(!S.gToken)throw new Error('לא מחובר');
  const url=`https://sheets.googleapis.com/v4/spreadsheets/${CFG.SID}/values/${encodeURIComponent("'"+name+"'!"+range)}?valueInputOption=USER_ENTERED`;
  const r=await fetch(url,{method:'PUT',headers:{'Authorization':'Bearer '+S.gToken,'Content-Type':'application/json'},body:JSON.stringify({values})});
  if(!r.ok)throw new Error('עדכון נכשל');
  return await r.json();
}

// Find row in sheet by value in column A
async function shFindRow(name,searchVal){
  const data=await shRead(name);
  for(let i=1;i<data.length;i++){if((data[i][0]||'')==searchVal)return i+1;}// 1-indexed
  return -1;
}

// ============================================================
// SYNC
// ============================================================
async function syncData(showLoad=true){
  if(showLoad)showLoading('מסנכרן...');
  try{
    const parse=(raw)=>{if(!raw||!raw.length)return{h:[],rows:[]};const hdr=raw[0].map(x=>(x||'').trim());
      const rows=raw.slice(1).map(r=>{const o={};hdr.forEach((h,i)=>{o[h]=(r[i]||'').toString().trim();});return o;});return{h:hdr,rows};};

    const[sR,pR,bR,oR,aR,uR]=await Promise.all([
      shRead(CFG.SH.SUP).catch(()=>[]),shRead(CFG.SH.PROD).catch(()=>[]),
      shRead(CFG.SH.BUD).catch(()=>[]),shRead(CFG.SH.ORD).catch(()=>[]),
      shRead(CFG.SH.APP).catch(()=>[]),shRead(CFG.SH.USERS).catch(()=>[])
    ]);

    const s=parse(sR),p=parse(pR),b=parse(bR),o=parse(oR),a=parse(aR),u=parse(uR);

    S.data.suppH=s.h;S.data.suppliers=s.rows;
    S.data.prodH=p.h;S.data.products=p.rows;
    S.data.budH=b.h;S.data.budget=b.rows;
    if(o.rows.length)S.data.orders=o.rows;
    if(a.rows.length)S.data.approvedOrders=a.rows;

    // Users
    if(u.rows.length){
      S.data.users=u.rows.map(r=>({
        email:r['מייל']||r['email']||'',
        name:r['שם']||r['name']||'',
        role:r['תפקיד']||r['role']||'viewer',
        projects:Object.entries(r).filter(([k,v])=>k.includes('פרויקט')&&v&&v!=='הכל').map(([k,v])=>v.trim()).filter(Boolean),
        allProjects:Object.values(r).some(v=>v==='הכל')
      })).filter(x=>x.email);
      localStorage.setItem('ez_users',JSON.stringify(S.data.users));
      log('Users: '+S.data.users.map(u=>u.email).join(', '));
      // Update current session
      if(S.user){const upd=S.data.users.find(x=>x.email.toLowerCase()===S.user.email?.toLowerCase()||x.email.toLowerCase()===S.user.googleEmail?.toLowerCase());
        if(upd){S.user={...S.user,...upd};localStorage.setItem('ez_session',JSON.stringify(S.user));}}
    }

    // Projects from budget
    const ps=new Set();
    b.rows.forEach(r=>{for(const[k,v] of Object.entries(r))if(k.includes('פרויקט')&&v)ps.add(v);});
    if(!ps.size)['נוף הגלעד 11','נוף הגלעד 18','נוף הדגן אלון מורה','עדן 21','בזלת 16','גבעת סלעית מחולה','האופק 32 ירוחם','האופק 36 ירוחם','צורים'].forEach(x=>ps.add(x));
    S.data.projects=[...ps];

    save();
    if(showLoad){hideLoading();toast('סנכרון הושלם','ok');}
  }catch(e){if(showLoad)hideLoading();toast(e.message,'err');log('SYNC ERR: '+e.message);}
  renderPage();
}

// ============================================================
// UTILS
// ============================================================
function fc(obj,names){for(const n of names)if(obj[n]!==undefined&&obj[n]!=='')return obj[n];
  for(const k of Object.keys(obj))for(const n of names)if(k.includes(n))return obj[k];return '';}
function fh(headers,names){for(const n of names){const f=headers.find(h=>h===n);if(f)return f;}
  for(const n of names){const f=headers.find(h=>h.includes(n));if(f)return f;}return headers[0]||'';}

function fmt(n){return(parseFloat(n)||0).toLocaleString('he-IL',{maximumFractionDigits:0});}
function cur(n){return '₪'+fmt(n);}
function genId(){const d=new Date();return`PO-${d.getFullYear().toString().slice(2)}${String(d.getMonth()+1).padStart(2,'0')}${String(d.getDate()).padStart(2,'0')}-${Math.floor(Math.random()*900+100)}`;}
function now(){const d=new Date();return d.toLocaleDateString('he-IL')+' '+d.toLocaleTimeString('he-IL',{hour:'2-digit',minute:'2-digit'});}

function toast(m,t='info'){const c=document.getElementById('toasts'),el=document.createElement('div');el.className='toast t-'+(t==='ok'?'ok':t==='err'?'err':'info');el.textContent=m;c.appendChild(el);setTimeout(()=>{el.style.opacity='0';el.style.transition='opacity 0.3s';setTimeout(()=>el.remove(),300);},4000);}
function showLoading(m){let e=document.getElementById('ldg');if(!e){e=document.createElement('div');e.id='ldg';e.className='loading';document.body.appendChild(e);}e.innerHTML=`<div class="spinner"></div><div style="color:var(--text2)">${m}</div>`;e.style.display='flex';}
function hideLoading(){const e=document.getElementById('ldg');if(e)e.style.display='none';}
function openModal(h){document.getElementById('modalBox').innerHTML=h;document.getElementById('modalBg').classList.add('show');}
function closeModal(){document.getElementById('modalBg').classList.remove('show');}

function getBudgetDomain(r){return fc(r,['תחום','שם סעיף','סעיף']);}
function getBudgetSub(r){return fc(r,['תת תחום','תת_תחום']);}
function getBudgetProject(r){return fc(r,['פרויקט','project']);}
function getBudgetAmt(r){let v=fc(r,['מחיר','תקציב','סכום']);if(v)return parseFloat(String(v).replace(/[₪,]/g,''))||0;
  for(const k of[...Object.keys(r)].reverse()){const n=parseFloat(String(r[k]).replace(/[₪,]/g,''));if(!isNaN(n)&&n>0)return n;}return 0;}
function getBudgetForProj(p){return S.data.budget.filter(b=>getBudgetProject(b)===p);}
function getDomainSummary(proj){const rows=getBudgetForProj(proj),doms=new Map();
  rows.forEach(r=>{const d=getBudgetDomain(r),amt=getBudgetAmt(r);if(!d)return;if(!doms.has(d))doms.set(d,{name:d,budget:0,subs:[]});
    const e=doms.get(d);e.budget+=amt;e.subs.push({sub:getBudgetSub(r)||'כללי',amt});});return[...doms.values()];}

function getSupEmail(name){const nc=S.data.suppH[0]||'';const ec=fh(S.data.suppH,['מייל','email']);
  const s=S.data.suppliers.find(x=>(x[nc]||'').trim()===name.trim())||S.data.suppliers.find(x=>(x[nc]||'').includes(name)||name.includes(x[nc]||''));
  return s?(s[ec]||''):'';} 
function getSupContact(name){const nc=S.data.suppH[0]||'';const cc=fh(S.data.suppH,['איש קשר','contact']);
  const s=S.data.suppliers.find(x=>(x[nc]||'').trim()===name.trim());return s?(s[cc]||''):'';} 

function findRowAmount(row){for(const n of['סהכ','סכום','total'])for(const k of Object.keys(row))if(k.includes(n)){
  const v=parseFloat(String(row[k]).replace(/[₪,]/g,''));if(!isNaN(v)&&v>0)return v;}return 0;}
function getApprovedTotal(proj,domain){let t=0;const c=new Set();
  (S.data.approvedOrders||[]).forEach(r=>{const oid=r['מספר הזמנה'];if(c.has(oid))return;if(r['פרויקט']!==proj)return;if(domain&&r['תחום']!==domain)return;c.add(oid);
    t+=findRowAmount(r);});return t;}

function getAllOrders(){const m=new Map(),del=getDeleted();
  (S.data.orders||[]).forEach(r=>{const id=r['מספר הזמנה'];if(!id||del.includes(id))return;if(!m.has(id))m.set(id,{...r,_items:[]});m.get(id)._items.push(r);});
  getLO().forEach(o=>{const id=o['מספר הזמנה'];if(id&&!del.includes(id))m.set(id,o);});return[...m.values()];}
function getOrderItems(o){if(o.items&&Array.isArray(o.items))return o.items;if(o._items)return o._items.map(r=>({id:r['מקט']||'',desc:r['תיאור מוצר']||r['תיאור']||'',qty:parseInt(r['כמות'])||0,price:parseFloat(r['מחיר ליחידה'])||0,total:parseFloat(r['סהכ שורה'])||0}));return[];}

function getUserProjects(){if(!S.user||S.user.allProjects||S.user.role==='admin'||S.user.role==='מנהל רכש')return S.data.projects;
  return S.user.projects&&S.user.projects.length?S.user.projects:S.data.projects;}
function getMyOrders(){const all=getAllOrders();if(S.user?.role==='admin'||S.user?.role==='מנהל רכש')return all;
  return all.filter(o=>(o['יוצר']||'')===S.user?.name||(o['יוצר']||'')===S.user?.googleName);}

let selDomain='';

      <div class="stat blue"><div class="stat-val">${cur(tb)}</div><div class="stat-lbl">תקציב</div></div>
      <div class="stat green"><div class="stat-val">${cur(tu)}</div><div class="stat-lbl">ביצוע</div></div>

    </div>

      ${secs.map(s=>{const c=s.p>90?'var(--red)':s.p>70?'var(--orange)':'var(--green)';
        return`<div class="brow"><div class="brow-name">${s.nm}</div>

          <div class="brow-item"><div class="v" style="color:${s.r<0?'var(--red)':'var(--green)'}">${cur(s.r)}</div><div class="l">יתרה</div></div>
          <div style="width:100%"><div class="prog"><div class="prog-fill" style="width:${Math.min(s.p,100)}%;background:${c}"></div></div></div>

        <div class="stat ${dp>80?'red':'blue'}"><div class="stat-val">${dp}%</div><div class="stat-lbl">%</div></div>
      </div>
      <div class="card"><div class="card-title">תתי תחום — ${sd}<span class="sub">${sp}</span></div>

  const items=getOrderItems(o);const st=o['סטטוס']||'ממתין';
  const bc=st.includes('מאושר')?'b-approved':st.includes('נדח')?'b-rejected':'b-pending';
  openModal(`<h3>${oid}</h3>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:6px;font-size:13px;margin-bottom:12px">
      <div>📅 ${o['תאריך']||''}</div><div><span class="badge ${bc}">${st}</span></div>
      <div>🏢 ${o['ספק']||''}</div><div>📁 ${o['פרויקט']||''}</div>
      <div>👤 ${o['יוצר']||''}</div><div>${o['תחום']?'🏗 '+o['תחום']:''}</div>
    </div>

      <div class="oi-meta"><span>מק״ט: ${it.id||''}</span><span>כמות: ${it.qty}</span><span>מחיר: ${cur(it.price||0)}</span></div></div>`).join(''):''}

    <div class="btn-row" style="flex-direction:column">
      <button class="btn btn-p" onclick="sendMail(getOrd('${oid}'))">📧 מייל</button>
      <button class="btn btn-o" onclick="makePDF('${oid}')">📄 PDF</button>
      ${S.user?.role==='admin'?`<button class="btn btn-d" onclick="deleteOrder('${oid}')">🗑 מחק</button>`:''}
      <button class="btn btn-o" onclick="closeModal()">סגור</button>
    </div>`);
}
function getOrd(id){return getAllOrders().find(o=>o['מספר הזמנה']===id);}

function deleteOrder(oid){if(!confirm('למחוק '+oid+'?'))return;
  const del=getDeleted();if(!del.includes(oid))del.push(oid);localStorage.setItem('ez_del',JSON.stringify(del));
  saveLO(getLO().filter(o=>o['מספר הזמנה']!==oid));saveLA(getLA().filter(o=>o['מספר הזמנה']!==oid));
  S.data.orders=(S.data.orders||[]).filter(o=>o['מספר הזמנה']!==oid);save();
  closeModal();toast('נמחק','ok');renderPage();}

async function submitOrder(){
  if(!await requireAuth())return;
  const sup=document.getElementById('oSup').value,proj=document.getElementById('oProj').value,dom=document.getElementById('oDom').value,sub=document.getElementById('oSub').value,notes=document.getElementById('oNotes').value;
  if(!sup){toast('בחרו ספק','err');return;}if(!proj){toast('בחרו פרויקט','err');return;}
  if(oi.every(i=>!i.pid)){toast('הוסיפו מוצר','err');return;}
  let subtot=0;const items=[];
  oi.forEach(it=>{if(!it.pid)return;const l=(parseFloat(it.price)||0)*(parseInt(it.qty)||0);subtot+=l;
    items.push({id:it.pid==='custom'?'חופשי':it.pid,desc:it.desc||it.pid,qty:parseInt(it.qty),price:parseFloat(it.price),total:l});});
  const vat=subtot*CFG.VAT,total=subtot+vat,oid=genId();
  const order={'מספר הזמנה':oid,'תאריך':now(),'ספק':sup,'פרויקט':proj,'תחום':dom,'תת תחום':sub,
    'יוצר':S.user?.name||S.user?.googleName||'','סטטוס':'ממתין לאישור','סהכ הזמנה לפני מעמ':subtot,'מעמ':vat,'סהכ הזמנה כולל מעמ':total,'הערות':notes,items};

  showLoading('שומר...');
  try{const ex=await shRead(CFG.SH.ORD).catch(()=>[]);if(!ex.length)await shWrite(CFG.SH.ORD,[ORD_H]);
    const rows=items.map(it=>ORD_H.map(h=>{switch(h){case 'מספר הזמנה':return oid;case 'תאריך':return now();case 'ספק':return sup;case 'פרויקט':return proj;
      case 'תחום':return dom;case 'תת תחום':return sub;case 'יוצר':return order['יוצר'];case 'סטטוס':return 'ממתין לאישור';
      case 'מקט':return it.id;case 'תיאור מוצר':return it.desc;case 'כמות':return String(it.qty);case 'מחיר ליחידה':return String(it.price);
      case 'סהכ שורה':return String(it.total);case 'סהכ הזמנה לפני מעמ':return String(subtot);case 'מעמ':return String(vat);
      case 'סהכ הזמנה כולל מעמ':return String(total);case 'הערות':return notes;default:return '';}}));
    await shWrite(CFG.SH.ORD,rows);
    const lo=getLO();lo.push(order);saveLO(lo);hideLoading();toast('✅ הזמנה נשמרה','ok');
    sendMail(order);oi=[{pid:'',qty:1,price:0,desc:''}];navigate('orders');
  }catch(e){hideLoading();toast('❌ '+e.message,'err');}
}

async function doApprove(oid,n){
  if(!await requireAuth())return;if(!confirm('לאשר '+oid+'?'))return;
  const orders=getLO(),o=orders.find(x=>x['מספר הזמנה']===oid);if(!o){toast('לא נמצא','err');return;}
  const items=o.items||[];const approved=[];
  for(let i=0;i<n;i++){const ck=document.getElementById('ac_'+oid+'_'+i)?.checked;const q=parseInt(document.getElementById('aq_'+oid+'_'+i)?.value)||0;
    if(ck&&q>0)approved.push({...items[i],approvedQty:q,total:q*(parseFloat(items[i]?.price)||0)});}
  if(!approved.length){toast('לא אושר שום פריט','err');return;}
  let sub=0;approved.forEach(it=>sub+=it.total);const vat=sub*CFG.VAT,total=sub+vat;
  o['סטטוס']='מאושר';o['מאשר']=S.user?.name||'';o['תאריך אישור']=now();saveLO(orders);

  showLoading('מאשר...');
  try{const ex=await shRead(CFG.SH.APP).catch(()=>[]);if(!ex.length)await shWrite(CFG.SH.APP,[APP_H]);
    const rows=approved.map(it=>APP_H.map(h=>{switch(h){
      case 'מספר הזמנה':return oid;case 'תאריך':return o['תאריך'];case 'ספק':return o['ספק'];case 'פרויקט':return o['פרויקט'];
      case 'תחום':return o['תחום']||'';case 'תת תחום':return o['תת תחום']||'';case 'יוצר':return o['יוצר']||'';case 'סטטוס':return 'מאושר';
      case 'מקט':return it.id||'';case 'תיאור מוצר':return it.desc||'';case 'כמות':return String(it.approvedQty||it.qty);
      case 'מחיר ליחידה':return String(it.price||0);case 'סהכ שורה':return String(it.total);
      case 'סהכ הזמנה לפני מעמ':return String(sub);case 'מעמ':return String(vat);case 'סהכ הזמנה כולל מעמ':return String(total);
      case 'הערות':return o['הערות']||'';case 'מאשר':return S.user?.name||'';case 'תאריך אישור':return now();default:return '';}}));
    await shWrite(CFG.SH.APP,rows);

    // Update status in orders sheet
    try{const ordData=await shRead(CFG.SH.ORD);
      for(let i=1;i<ordData.length;i++){if((ordData[i][0]||'')===oid){await shUpdate(CFG.SH.ORD,'H'+(i+1),[['מאושר']]);break;}}
    }catch(e){log('Status update err: '+e.message);}

    hideLoading();toast('✅ אושר','ok');
  }catch(e){hideLoading();toast('❌ '+e.message,'err');}
  renderPage();
}

function doReject(oid){if(!confirm('לדחות?'))return;
  const o=getLO(),x=o.find(y=>y['מספר הזמנה']===oid);if(x){x['סטטוס']='נדחה';saveLO(o);}
  // Update in sheets too
  shRead(CFG.SH.ORD).then(data=>{for(let i=1;i<data.length;i++){if((data[i][0]||'')===oid){shUpdate(CFG.SH.ORD,'H'+(i+1),[['נדחה']]).catch(()=>{});break;}}}).catch(()=>{});
  toast('נדחה','info');renderPage();}

  window.location.href='mailto:'+(email||'')+'?subject='+encodeURIComponent(subj)+'&body='+encodeURIComponent(body);
}

      let users=S.data.users||[];if(!users.length)try{users=JSON.parse(localStorage.getItem('ez_users'))||[];}catch(e){}
      const found=users.find(u=>u.email.toLowerCase()===sess.email.toLowerCase());
      if(found){S.user={...sess,...found};if(S.gToken)ensureAuth();showApp();return;}
    }
  }catch(e){}
  // Check if we have a google email from previous session
  const gemail=localStorage.getItem('ez_gemail');
  if(gemail&&S.gToken){tryLogin(gemail,localStorage.getItem('ez_gname')||gemail);return;}
  // Show auth page
  document.getElementById('authPage').style.display='flex';
}
init();
</script>
</body>
</html>
