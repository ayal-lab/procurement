<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0a0e1a">
<title>E.Z — מערכת רכש</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;600;700;800;900&display=swap');
:root{--bg:#0a0e1a;--bg2:#111827;--bg3:#1e2538;--bg4:#2a3348;--brd:#2e3650;--tx:#eef0f6;--tx2:#94a3c0;--tx3:#5e6b85;
--bl:#2d7ff9;--bl2:#1a6be6;--bls:rgba(45,127,249,0.12);--gn:#10b981;--gns:rgba(16,185,129,0.12);
--or:#f59e0b;--ors:rgba(245,158,11,0.12);--rd:#ef4444;--rds:rgba(239,68,68,0.12);--pp:#8b5cf6;--pps:rgba(139,92,246,0.14);--r:10px}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Heebo',sans-serif;background:var(--bg);color:var(--tx);direction:rtl;min-height:100vh;font-variant-numeric:tabular-nums}
::-webkit-scrollbar{width:4px;height:4px}::-webkit-scrollbar-thumb{background:var(--bg4);border-radius:2px}

.auth{display:flex;align-items:center;justify-content:center;min-height:100vh;padding:20px;background:linear-gradient(135deg,#0a0e1a,#111827)}
.auth-box{background:var(--bg2);border:1px solid var(--brd);border-radius:20px;padding:36px;width:100%;max-width:360px;text-align:center}
.auth-box img{width:90px;margin-bottom:16px;border-radius:10px}
.auth-box h1{font-size:22px;font-weight:800;margin-bottom:6px}
.auth-box p{color:var(--tx2);font-size:13px;margin-bottom:24px}
.gbtn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:13px;background:#fff;color:#333;border:none;border-radius:var(--r);font:600 15px 'Heebo';cursor:pointer}
.gbtn:hover{box-shadow:0 4px 16px rgba(255,255,255,0.1)}
.gbtn img{width:18px}
.aerr{color:var(--rd);font-size:12px;margin-top:14px;display:none;padding:10px;background:var(--rds);border-radius:var(--r);text-align:right;line-height:1.5}

.app{display:none;min-height:100vh;padding-bottom:70px}
.hdr{display:flex;align-items:center;gap:8px;padding:10px 14px;background:var(--bg2);border-bottom:1px solid var(--brd);position:sticky;top:0;z-index:50}
.hdr img{width:32px;border-radius:6px}
.hdr-t{font-size:14px;font-weight:700;flex:1}
.hdr-u{font-size:11px;color:var(--tx2);text-align:left;line-height:1.3}
.hdr-u b{color:var(--tx);font-size:12px}
.hbtn{background:none;border:1px solid var(--brd);color:var(--tx2);padding:5px 10px;border-radius:8px;font-size:11px;font-family:inherit;cursor:pointer}
.hdot{width:7px;height:7px;border-radius:50%;display:inline-block;margin-left:3px}
.dg{background:var(--gn)}.dr{background:var(--rd)}

.mc{padding:14px;max-width:920px;margin:0 auto}

.bnav{position:fixed;bottom:0;left:0;right:0;background:var(--bg2);border-top:1px solid var(--brd);display:flex;justify-content:space-evenly;padding:5px 4px env(safe-area-inset-bottom,5px);z-index:100}
.bt{display:flex;flex-direction:column;align-items:center;gap:1px;padding:4px 2px;color:var(--tx3);font-size:9px;cursor:pointer;flex:1;max-width:70px;-webkit-tap-highlight-color:transparent;position:relative}
.bt.active{color:var(--bl)}
.bt .bi{font-size:18px}
.bt-badge{background:var(--rd);color:#fff;font-size:8px;padding:1px 4px;border-radius:6px;position:absolute;top:0;right:calc(50% - 16px)}

.card{background:var(--bg2);border:1px solid var(--brd);border-radius:12px;padding:16px;margin-bottom:12px}
.card-t{font-size:14px;font-weight:700;margin-bottom:10px;display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.card-t .sub{font-size:11px;color:var(--tx2);font-weight:400}

.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.st{background:var(--bg2);border:1px solid var(--brd);border-radius:12px;padding:14px 8px;text-align:center}
.st-v{font-size:20px;font-weight:800}.st-l{font-size:10px;color:var(--tx2);margin-top:2px}
.st.bl .st-v{color:var(--bl)}.st.gn .st-v{color:var(--gn)}.st.or .st-v{color:var(--or)}.st.rd .st-v{color:var(--rd)}.st.pp .st-v{color:var(--pp)}

.fltr{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap}
.fltr select,.fltr input{flex:1;min-width:120px;padding:9px;background:var(--bg3);border:1px solid var(--brd);border-radius:var(--r);color:var(--tx);font:14px 'Heebo'}

.prog{height:5px;background:var(--bg4);border-radius:3px;overflow:hidden;margin-top:3px}
.pf{height:100%;border-radius:3px}

.brow{padding:14px 0;border-bottom:1px solid var(--brd)}
.brow:last-child{border:none}
.brow-n{font-weight:600;font-size:14px;margin-bottom:8px}
.brow-d{display:flex;flex-wrap:wrap;gap:6px 20px;font-size:12px}
.brow-d .i{display:flex;flex-direction:column;align-items:center;min-width:55px}
.brow-d .v{font-weight:700;font-size:14px}.brow-d .l{font-size:9px;color:var(--tx3)}

.badge{display:inline-block;padding:2px 8px;border-radius:5px;font-size:10px;font-weight:600;white-space:nowrap}
.b-p{background:var(--ors);color:var(--or)}.b-a{background:var(--gns);color:var(--gn)}.b-r{background:var(--rds);color:var(--rd)}.b-i{background:var(--bls);color:var(--bl)}.b-v{background:var(--pps);color:var(--pp)}

.fg{margin-bottom:12px}
.fg label{display:block;font-size:11px;color:var(--tx2);margin-bottom:3px;font-weight:500}
.fg select,.fg input,.fg textarea{width:100%;padding:9px 10px;background:var(--bg3);border:1px solid var(--brd);border-radius:var(--r);color:var(--tx);font:14px 'Heebo'}
.fg textarea{min-height:90px;resize:vertical}
.frow{display:grid;grid-template-columns:1fr 1fr;gap:8px}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:5px;padding:10px 18px;border:none;border-radius:var(--r);font:600 13px 'Heebo';cursor:pointer;width:100%;transition:all 0.15s;text-decoration:none}
.btn:disabled{opacity:.5;cursor:default}
.bp{background:var(--bl);color:#fff}.bg{background:var(--gn);color:#fff}.bd{background:var(--rd);color:#fff}.bv{background:var(--pp);color:#fff}
.bo{background:none;color:var(--tx2);border:1px solid var(--brd)}.bs{padding:7px 12px;font-size:11px;width:auto}
.br{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}

.oi{background:var(--bg3);border-radius:var(--r);padding:10px;margin-bottom:6px}

.tw{overflow-x:auto;border:1px solid var(--brd);border-radius:var(--r);margin:8px 0}
table.t{width:100%;border-collapse:collapse;font-size:12px}
table.t th{background:var(--bg3);color:var(--tx2);font-weight:600;font-size:10px;padding:7px 8px;text-align:right;white-space:nowrap}
table.t td{padding:7px 8px;border-top:1px solid var(--brd);vertical-align:middle}
table.t td.n{text-align:left;white-space:nowrap}
table.t tr.xr td{background:var(--rds)}table.t tr.xo td{background:var(--ors)}
table.t input,table.t select{padding:5px 6px;background:var(--bg);border:1px solid var(--brd);border-radius:6px;color:var(--tx);font:12px 'Heebo'}
.mono{font-family:ui-monospace,Consolas,monospace;font-size:11px;direction:ltr;unicode-bidi:embed}

.drop{display:block;border:1.5px dashed var(--brd);border-radius:12px;padding:16px;text-align:center;background:var(--bg3);cursor:pointer;font-size:13px}
.drop:hover,.drop.on{border-color:var(--bl);background:var(--bls)}
.drop input{display:none}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.chip{font-size:11px;background:var(--bg3);border:1px solid var(--brd);border-radius:14px;padding:3px 10px;color:var(--tx2);text-decoration:none}
.verd{padding:12px;border-radius:var(--r);font-size:13px;margin:8px 0;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.verd b{font-size:15px}
.v-ok{background:var(--gns);color:var(--gn)}.v-bad{background:var(--rds);color:var(--rd)}.v-mid{background:var(--ors);color:var(--or)}
.steps{display:flex;gap:4px;align-items:center;font-size:11px;color:var(--tx3);flex-wrap:wrap;margin-top:6px}
.steps span.on{color:var(--gn);font-weight:600}
.note{font-size:11px;color:var(--tx3)}
.think{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--tx2)}

.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,0.7);z-index:200;display:flex;align-items:flex-start;justify-content:center;padding:20px 10px;opacity:0;pointer-events:none;transition:opacity 0.2s;overflow-y:auto}
.modal-bg.show{opacity:1;pointer-events:all}
.modal-bx{background:var(--bg2);border:1px solid var(--brd);border-radius:14px;width:100%;max-width:620px;padding:18px}
.modal-bx h3{font-size:17px;font-weight:700;margin-bottom:12px}

.toast-c{position:fixed;top:10px;left:10px;right:10px;z-index:999;display:flex;flex-direction:column;align-items:center;gap:5px;pointer-events:none}
.toast{padding:10px 16px;border-radius:var(--r);font-size:12px;font-weight:500;max-width:380px;width:100%;text-align:center;animation:tI 0.3s}
.t-ok{background:var(--gn);color:#fff}.t-er{background:var(--rd);color:#fff}.t-in{background:var(--bl);color:#fff}
@keyframes tI{from{transform:translateY(-16px);opacity:0}to{transform:translateY(0);opacity:1}}

.ldg{position:fixed;inset:0;background:rgba(10,14,26,0.85);z-index:300;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:10px}
.spn{width:28px;height:28px;border:3px solid var(--brd);border-top-color:var(--bl);border-radius:50%;animation:sp 0.6s linear infinite}
.spn.sm{width:16px;height:16px;border-width:2px}
@keyframes sp{to{transform:rotate(360deg)}}

.empty{text-align:center;padding:32px;color:var(--tx3)}.empty .ei{font-size:36px;margin-bottom:6px}
.chart-wrap{display:flex;justify-content:center;margin:12px 0}

@media(min-width:768px){.stats{grid-template-columns:repeat(4,1fr)}.mc{padding:20px}}
@media(max-width:420px){.frow{grid-template-columns:1fr}}
</style>
</head>

<div class="toast-c" id="TC"></div>

<div class="auth" id="authP">
<div class="auth-box">
<img class="logo" alt="E.Z">
<h1>מערכת רכש</h1>
<p>היכנסו עם חשבון Google.<br>הגישה למורשים בלבד.</p>
<button class="gbtn" onclick="gLogin()"><img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" alt="">כניסה עם Google</button>
<div class="aerr" id="aErr"></div>
</div></div>

<div class="app" id="appP">
<div class="hdr">
<img class="logo" alt="E.Z">
<div class="hdr-t">E.Z רכש</div>
<div class="hdr-u"><b id="uN"></b><br><span id="uR"></span></div>
<button class="hbtn" onclick="settings()" title="הגדרות">⚙</button>
<button class="hbtn" onclick="handleG()" id="gB">🔗</button>
<button class="hbtn" onclick="logout()" title="יציאה">⏻</button>
</div>
<div class="mc" id="MC"></div>
<div class="bnav" id="BN"></div>
</div>

<div class="modal-bg" id="mBg" onclick="if(event.target===this)cModal()"><div class="modal-bx" id="mBx"></div></div>

// GOOGLE AUTH
function gLogin(){const r=window.location.origin+window.location.pathname;
  window.location.href=`https://accounts.google.com/o/oauth2/v2/auth?client_id=${C.CID}&redirect_uri=${encodeURIComponent(r)}&response_type=token&scope=${encodeURIComponent(C.SCOPES)}&prompt=select_account`;}

function checkOA(){const h=window.location.hash;if(h.includes('access_token')){
  const p=new URLSearchParams(h.substring(1));const t=p.get('access_token');
  if(t){S.gToken=t;S.gAuth=true;save();window.history.replaceState(null,'',window.location.pathname);fetchGU(t);}}}

async function fetchGU(tok){try{const r=await fetch('https://www.googleapis.com/oauth2/v2/userinfo',{headers:{'Authorization':'Bearer '+tok}});
  if(r.ok){const u=await r.json();log('Google: '+u.email);localStorage.setItem('ez_ge',u.email);localStorage.setItem('ez_gn',u.name||'');tryLogin(u.email,u.name||u.email);}}catch(e){log('GU err:'+e.message);}}

async function tryLogin(email,name){
  log('tryLogin: '+email);let users=[];
  try{const uR=await shRead(C.SH.USR);
    if(uR.length>1){const hdr=uR[0].map(h=>(h||'').trim());
      const rows=uR.slice(1).map(r=>{const o={};hdr.forEach((h,i)=>{o[h]=(r[i]||'').trim();});return o;});
      users=rows.map(r=>({email:r['מייל']||r['email']||'',name:r['שם']||'',role:r['תפקיד']||'viewer',
        projects:Object.entries(r).filter(([k,v])=>k.includes('פרויקט')&&v&&v!=='הכל').map(([k,v])=>v.trim()).filter(Boolean),
        allProj:Object.values(r).some(v=>v==='הכל')})).filter(x=>x.email);
      S.data.users=users;localStorage.setItem('ez_usr',JSON.stringify(users));}}catch(e){log('USR err:'+e.message);
    try{users=JSON.parse(localStorage.getItem('ez_usr'))||[];}catch(e2){}}
  const f=users.find(u=>(u.email||'').toLowerCase().trim()===email.toLowerCase().trim());
  if(f){S.user={...f,gName:name,gEmail:email};localStorage.setItem('ez_ss',JSON.stringify(S.user));showApp();}
  else{const err=document.getElementById('aErr');err.style.display='block';
    err.innerHTML='<b>'+esc(email)+'</b> לא מורשה. בקשו ממנהל המערכת להוסיף אתכם לגיליון "משתמשים".';}}

  <div style="display:flex;flex-direction:column;gap:8px"><button class="btn bp" onclick="cModal();gLogin()">${S.gAuth?'החלף חשבון':'התחבר'}</button>
  ${S.gAuth?'<button class="btn bd" onclick="S.gToken=null;S.gAuth=false;save();cModal();toast(\'מנותק\');updHdr()">התנתק</button>':''}
  <button class="btn bo" onclick="cModal()">סגור</button></div>`);}

function logout(){S.user=null;localStorage.removeItem('ez_ss');document.getElementById('appP').style.display='none';document.getElementById('authP').style.display='flex';}

async function reqAuth(){if(!S.gToken){handleG();return false;}
  try{const r=await fetch('https://www.googleapis.com/oauth2/v1/tokeninfo?access_token='+S.gToken);if(r.ok){S.gAuth=true;return true;}}catch(e){}
  S.gAuth=false;S.gToken=null;save();oModal(`<h3>⚠️ פג תוקף החיבור ל-Google</h3><p style="color:var(--tx2);margin-bottom:10px">התחברו מחדש כדי לשמור ולשלוח.</p>
    <button class="btn bp" onclick="cModal();gLogin()">🔗 התחבר</button>`);return false;}

const rng=(n,a)=>encodeURIComponent("'"+n+"'"+(a?'!'+a:''));
async function shRead(n){const r=await fetch(`https://sheets.googleapis.com/v4/spreadsheets/${C.SID}/values/${rng(n)}?key=${C.KEY}`);
  if(!r.ok)throw new Error('קריאה: '+n);return(await r.json()).values||[];}
async function gfetch(url,opt={}){if(!S.gToken)throw new Error('לא מחובר ל-Google');
  const r=await fetch(url,{...opt,headers:{'Authorization':'Bearer '+S.gToken,'Content-Type':'application/json',...(opt.headers||{})}});
  if(!r.ok){if(r.status===401){S.gToken=null;S.gAuth=false;save();throw new Error('פג תוקף החיבור ל-Google');}
    if(r.status===403)throw new Error('אין הרשאה (בדקו שהחשבון יכול לערוך את הגיליון)');throw new Error('הבקשה ל-Google נכשלה ('+r.status+')');}
  return r.status===204?null:r.json();}
const shWrite=(n,v)=>gfetch(`https://sheets.googleapis.com/v4/spreadsheets/${C.SID}/values/${rng(n,'A1')}:append?valueInputOption=USER_ENTERED&insertDataOption=INSERT_ROWS`,{method:'POST',body:JSON.stringify({values:v})});
const shUpdate=(n,range,v)=>gfetch(`https://sheets.googleapis.com/v4/spreadsheets/${C.SID}/values/${rng(n,range)}?valueInputOption=USER_ENTERED`,{method:'PUT',body:JSON.stringify({values:v})});
const shClear=n=>gfetch(`https://sheets.googleapis.com/v4/spreadsheets/${C.SID}/values/${rng(n)}:clear`,{method:'POST',body:'{}'});
const shBatchVals=data=>gfetch(`https://sheets.googleapis.com/v4/spreadsheets/${C.SID}/values:batchUpdate`,{method:'POST',body:JSON.stringify({valueInputOption:'USER_ENTERED',data})});

// Creates missing tabs and fixes header rows, once per session, before the first write.
async function ensureSheets(){
  if(S.tabs)return;
  const meta=await gfetch(`https://sheets.googleapis.com/v4/spreadsheets/${C.SID}?fields=sheets.properties(title,sheetId)`);
  const have=new Set(meta.sheets.map(s=>s.properties.title));
  const want={[C.SH.ORD]:OH,[C.SH.APP]:AH,[C.SH.RCV]:RH,[C.SH.INV]:IH,[C.SH.TRK]:TH};
  const add=Object.keys(want).filter(t=>!have.has(t));
  if(add.length){await gfetch(`https://sheets.googleapis.com/v4/spreadsheets/${C.SID}:batchUpdate`,{method:'POST',body:JSON.stringify({requests:add.map(title=>({addSheet:{properties:{title,rightToLeft:true,gridProperties:{frozenRowCount:1}}}}))})});log('נוספו לשוניות: '+add.join(', '));}
  const fix=[];
  for(const[t,h] of Object.entries(want)){let first=[];if(have.has(t)){try{first=(await shRead(t))[0]||[];}catch(e){}}
    if(h.some((x,i)=>(first[i]||'').trim()!==x))fix.push({range:"'"+t+"'!A1",values:[h]});}
  if(fix.length){await shBatchVals(fix);log('תוקנו כותרות: '+fix.map(f=>f.range).join(', '));}
  S.tabs=true;
  // Approved orders from before this version get their waiting-for-delivery rows too.
  const missing=allOrders().filter(o=>isApproved(o)&&!S.data.rcvRows.some(r=>r['מספר הזמנה']===o.id));
  if(missing.length)await shWrite(C.SH.RCV,missing.flatMap(o=>rcvPendingRows(o,apprLines(o))));}

const F_GAP='=IF(INDIRECT("J"&ROW())="","",INDIRECT("J"&ROW())-INDIRECT("I"&ROW()))';
const F_ST='=IF(INDIRECT("J"&ROW())="","ממתין לאספקה",IF(INDIRECT("K"&ROW())=0,"תואם",IF(INDIRECT("K"&ROW())<0,"חסר","עודף")))';
const rcvPendingRows=(o,lines)=>lines.map((it,i)=>[o.id,i,'','',o.supplier,o.project,it.sku,it.desc,it.qty,'',F_GAP,F_ST,'','','']);

// DRIVE
async function uploadToDrive(blob,fileName,mime){
  const meta=JSON.stringify({name:fileName,mimeType:mime||blob.type||'application/octet-stream',parents:[C.DRIVE_FOLDER]});
  const form=new FormData();
  form.append('metadata',new Blob([meta],{type:'application/json'}));
  form.append('file',blob);
  const r=await fetch('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id,webViewLink',
    {method:'POST',headers:{'Authorization':'Bearer '+S.gToken},body:form});
  if(!r.ok)throw new Error('העלאה לדרייב נכשלה');
  const f=await r.json();
  await fetch(`https://www.googleapis.com/drive/v3/files/${f.id}/permissions`,
    {method:'POST',headers:{'Authorization':'Bearer '+S.gToken,'Content-Type':'application/json'},
    body:JSON.stringify({role:'reader',type:'anyone'})}).catch(()=>{});
  return f.webViewLink||`https://drive.google.com/file/d/${f.id}/view`;}

// One object per order, built from the sheet rows (plus orders saved on this device that the sheet has not returned yet).
function allOrders(){const m=new Map(),del=getDel();
  S.data.ordRows.forEach(r=>{const id=r['מספר הזמנה'];if(!id||del.includes(id))return;
    if(!m.has(id))m.set(id,{id,date:r['תאריך'],supplier:r['ספק'],project:r['פרויקט'],domain:r['תחום'],sub:r['תת תחום'],creator:r['יוצר'],status:r['סטטוס'],
      subtotal:num(r['סהכ הזמנה לפני מעמ']),vat:num(r['מעמ']),total:num(r['סהכ הזמנה כולל מעמ']),notes:r['הערות'],items:[]});
    const o=m.get(id);if(r['סטטוס']&&r['סטטוס']!=='ממתין לאישור')o.status=r['סטטוס'];
    o.items.push({sku:r['מקט'],desc:r['תיאור מוצר'],qty:num(r['כמות']),price:num(r['מחיר ליחידה'])});});
  getLO().forEach(lo=>{const id=lo['מספר הזמנה'];if(!id||del.includes(id)||m.has(id))return;
    m.set(id,{id,date:lo['תאריך'],supplier:lo['ספק'],project:lo['פרויקט'],domain:lo['תחום'],sub:lo['תת תחום'],creator:lo['יוצר'],status:lo['סטטוס'],
      subtotal:num(lo['סהכ הזמנה לפני מעמ']),vat:num(lo['מעמ']),total:num(lo['סהכ הזמנה כולל מעמ']),notes:lo['הערות'],
      items:(lo.items||[]).map(it=>({sku:it.id,desc:it.desc,qty:num(it.qty),price:num(it.price)})),local:true});});
  return[...m.values()].sort((a,b)=>String(b.id).localeCompare(String(a.id)));}
const getOrder=id=>allOrders().find(o=>o.id===id);

function apprInfo(id){const rows=S.data.appRows.filter(r=>r['מספר הזמנה']===id);if(!rows.length)return null;
  return{by:rows[0]['מאשר'],at:rows[0]['תאריך אישור'],items:rows.map(r=>({sku:r['מקט'],desc:r['תיאור מוצר'],qty:num(r['כמות']),price:num(r['מחיר ליחידה'])}))};}
// Approved lines with a stable index (the "שורה" column in the receipt and invoice tabs).
function apprLines(o){const a=apprInfo(o.id);const src=a?a.items:(['נדחה','ממתין לאישור',''].includes(o.status||'')?[]:o.items);return src.map((it,i)=>({...it,i}));}
// Rows with an empty received quantity were created at approval and are still waiting for delivery.
function rcvInfo(id){const rows=S.data.rcvRows.filter(r=>r['מספר הזמנה']===id&&r['כמות שהתקבלה']!=='');if(!rows.length)return null;
  const q=new Map(),docs=new Map();rows.forEach(r=>{const i=parseInt(r['שורה']);if(!isNaN(i))q.set(i,(q.get(i)||0)+num(r['כמות שהתקבלה']));
    const k=r['מספר תעודת משלוח']+'|'+r['תאריך קבלה'];if(!docs.has(k))docs.set(k,{no:r['מספר תעודת משלוח'],date:r['תאריך קבלה'],by:r['מקבל'],file:r['קובץ']});});
  return{q,docs:[...docs.values()]};}
function invInfo(id){const rows=S.data.invRows.filter(r=>r['מספר הזמנה']===id);if(!rows.length)return null;
  const last=rows[rows.length-1]['תאריך בדיקה'],cur_=rows.filter(r=>r['תאריך בדיקה']===last);
  return{no:cur_[0]['מספר חשבונית'],date:cur_[0]['תאריך חשבונית'],decision:cur_[0]['החלטה'],by:cur_[0]['בודק'],at:last,file:cur_[0]['קובץ'],
    rows:cur_,billed:r2(cur_.reduce((s,r)=>s+num(r['סכום בחשבונית']),0)),diff:r2(cur_.reduce((s,r)=>s+num(r['הפרש']),0))};}

// Three-way match: approved ↔ received ↔ invoiced, per line.
function match3(o){const al=apprLines(o),rc=rcvInfo(o.id),iv=invInfo(o.id);
  const lines=al.map(L=>{const rq=rc?(rc.q.get(L.i)||0):null;const ir=iv?iv.rows.filter(r=>r['שורה']===String(L.i)):[];
    const iq=iv?ir.reduce((s,r)=>s+num(r['כמות בחשבונית']),0):null,it=ir.reduce((s,r)=>s+num(r['סכום בחשבונית']),0),ip=iq?it/iq:null;
    const flags=[];if(rq!==null&&rq<L.qty)flags.push('חסר באספקה');if(rq!==null&&rq>L.qty)flags.push('סופק עודף');
    if(iq!==null){const base=rq!==null?rq:L.qty;if(!ir.length)flags.push('לא חויב');else{if(Math.abs(iq-base)>1e-9)flags.push('כמות בחשבונית שונה');if(ip!==null&&Math.abs(ip-L.price)>0.011)flags.push('מחיר שונה');}}
    return{...L,rq,iq,ip,flags};});
  const extras=iv?iv.rows.filter(r=>r['שורה']===''||!al.some(L=>String(L.i)===r['שורה'])):[];
  const approved=r2(al.reduce((s,l)=>s+l.qty*l.price,0)),received=rc?r2(lines.reduce((s,l)=>s+(l.rq||0)*l.price,0)):null;
  return{lines,extras,approved,received,billed:iv?iv.billed:null,shortVal:rc?r2(lines.reduce((s,l)=>s+Math.max(0,l.qty-(l.rq||0))*l.price,0)):null,invDiff:iv?iv.diff:null,rc,iv};}

function stOf(o){const base=o.status||'ממתין לאישור';if(base==='נדחה')return'נדחה';
  const ap=apprInfo(o.id)||(base!=='ממתין לאישור'?{}:null);if(!ap)return'ממתין לאישור';
  const iv=invInfo(o.id);if(iv)return iv.decision==='אושרה לתשלום'?'חשבונית אושרה':'פערים בחשבונית';
  const rc=rcvInfo(o.id);if(rc){const m=match3(o);return m.lines.every(l=>(l.rq||0)>=l.qty)?'התקבל':'התקבל חלקית';}
  return'מאושר';}

// Rewrites the "מעקב הזמנות" tab: one row per approved order with what was approved, received and billed.
async function refreshTracking(){
  const rows=allOrders().filter(o=>isApproved(o)).map(o=>{const m=match3(o),st=stOf(o);
    const ok=st==='חשבונית אושרה'||(st==='התקבל'&&!m.iv);const issues=m.lines.reduce((s,l)=>s+l.flags.length,0)+m.extras.length;
    return[o.id,o.date,o.supplier,o.project,o.domain||'',st,m.approved,m.received??'',m.billed??'',m.shortVal??'',m.invDiff??'',
      !m.rc&&!m.iv?'ממתין לאספקה':issues?`${issues} פערים`:'תואם',now()];});
  await shClear(C.SH.TRK);await shUpdate(C.SH.TRK,'A1',[TH,...rows]);}

  const my=myOrders(),cnt=st=>my.filter(o=>stOf(o)===st).length;

const apiKey=()=>localStorage.getItem('ez_ak')||'';

  <div class="note" style="margin-bottom:10px">המפתח נשמר רק בדפדפן הזה, ולא בגיליון. בלי מפתח אפשר להזין כמויות ומחירים ידנית.</div>

  <button class="btn bo bs" onclick="cModal()">סגור</button></div>`);}
const fileB64=f=>new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(String(r.result).split(',')[1]);r.onerror=rej;r.readAsDataURL(f);});
// Phone photos are often larger than the API's image limit, so images are scaled to at most 2000px.
async function imgBlock(f){const bmp=await createImageBitmap(f);const sc=Math.min(1,2000/Math.max(bmp.width,bmp.height));
  const cv=document.createElement('canvas');cv.width=Math.round(bmp.width*sc);cv.height=Math.round(bmp.height*sc);cv.getContext('2d').drawImage(bmp,0,0,cv.width,cv.height);
  const b=await new Promise(r=>cv.toBlob(r,'image/jpeg',0.88));return{type:'image',source:{type:'base64',media_type:'image/jpeg',data:await fileB64(b)}};}
async function readDoc(kind,files,o,lines){
  if(!apiKey())throw new Error('nokey');
  if(!_sdk)_sdk=(await import(C.SDK_URL)).default;
  const client=new _sdk({apiKey:apiKey(),dangerouslyAllowBrowser:true});
  const content=[];
  for(const f of files){if(f.type==='application/pdf')content.push({type:'document',source:{type:'base64',media_type:'application/pdf',data:await fileB64(f)}});else content.push(await imgBlock(f));}
  const what=kind==='rcv'?'a delivery note (תעודת משלוח) that came with goods to a construction site':'a supplier tax invoice (חשבונית מס)';
  content.push({type:'text',text:`The attached file is ${what} from an Israeli supplier (Hebrew text, VAT 18%). We need to compare it with purchase order ${o.id} from supplier "${o.supplier}".
Approved order lines (index | SKU | description | qty | unit price before VAT):
${lines.map(L=>`${L.i} | ${L.sku} | ${L.desc} | ${L.qty} | ${L.price}`).join('\n')}

Extract every product line on the document as written. ${kind==='rcv'?'Delivery notes often have no prices; then use null for prices.':'Unit prices and line totals must be before VAT; if the document lists prices including VAT, divide by 1.18. Include a general discount as its own line with a negative total.'} Skip rows that are only subtotals, VAT, rounding or payment terms. For each line set "orderLine" to the index of the matching order line (match by SKU first, then by the meaning of the description, Hebrew abbreviations included), or null if nothing in the order matches.
Reply with only JSON, no other text:
{"docNumber":"","docDate":"","lines":[{"sku":"","description":"","qty":0,"unitPrice":null,"lineTotal":null,"orderLine":null}],"subtotal":null,"vat":null,"total":null,"notes":"short Hebrew note about anything unclear, or empty"}`});
  const msg=await client.beta.messages.create({model:C.CLAUDE_MODEL,max_tokens:16000,output_config:{effort:'medium'},
    betas:['server-side-fallback-2026-07-01'],fallbacks:'default',messages:[{role:'user',content}]});
  if(msg.stop_reason==='refusal')throw new Error('refusal');
  const txt=msg.content.filter(b=>b.type==='text').map(b=>b.text).join('').trim();
  const js=txt.slice(txt.indexOf('{'),txt.lastIndexOf('}')+1);
  const out=JSON.parse(js);if(!Array.isArray(out.lines))throw new Error('nolines');
  out.lines=out.lines.map(l=>({sku:String(l.sku||''),desc:String(l.description||''),qty:num(l.qty),price:l.unitPrice==null?null:num(l.unitPrice),
    total:l.lineTotal==null?null:num(l.lineTotal),match:lines.some(L=>L.i===Number(l.orderLine))&&l.orderLine!==null?Number(l.orderLine):null}));
  return out;}

const ilTot=l=>l.total!=null&&l.total!==''&&num(l.total)!==0?num(l.total):num(l.qty)*num(l.price);
function setIL(i,k,v){const l=ID.lines[i];l[k]=num(v);l.total=r2(num(l.qty)*num(l.price));render();}
function manualInv(){const o=getOrder(S.mo);if(!ID.lines.length){const rc=rcvInfo(o.id);
  ID.lines=apprLines(o).map(L=>({sku:L.sku,desc:L.desc,qty:rc?(rc.q.get(L.i)||0):L.qty,price:L.price,total:null,match:L.i}));}
  else ID.lines.push({sku:'',desc:'',qty:1,price:0,total:null,match:null});render();}

// Compares the invoice draft with what was approved and what was received.
function invCompare(o){const al=apprLines(o),rc=rcvInfo(o.id);
  const rows=al.map(L=>{const ms=ID.lines.filter(l=>l.match===L.i),iq=ms.reduce((s,l)=>s+num(l.qty),0),it=r2(ms.reduce((s,l)=>s+ilTot(l),0)),ip=iq?it/iq:0;
    const rq=rc?(rc.q.get(L.i)||0):null,base=rq!==null?rq:L.qty,exp=r2(base*L.price),why=[];
    if(!ms.length){if(base>0)why.push('לא חויב');}
    else{if(Math.abs(iq-base)>1e-9)why.push(rq!==null?`חויב על ${iq}, התקבלו ${rq}`:`חויב על ${iq}, אושרו ${L.qty}`);
      if(Math.abs(ip-L.price)>0.011)why.push(`מחיר ${cur2(ip)} במקום ${cur2(L.price)}`);}
    return{L,rq,iq,ip,it,exp,d:r2(it-exp),why};});
  const extras=ID.lines.filter(l=>l.match===null||!al.some(L=>L.i===l.match));
  const linesSum=r2(ID.lines.reduce((s,l)=>s+ilTot(l),0)),sub=ID.subtotal!==''?num(ID.subtotal):linesSum,vat=ID.vat!==''?num(ID.vat):r2(sub*C.VAT);
  const expected=r2(rows.reduce((s,r)=>s+r.exp,0)),diff=r2(sub-expected),checks=[];
  if(Math.abs(vat-sub*C.VAT)>1)checks.push(`המע״מ בחשבונית ${cur2(vat)} במקום ${cur2(sub*C.VAT)}`);
  if(ID.subtotal!==''&&Math.abs(linesSum-sub)>1)checks.push(`סכום השורות ${cur2(linesSum)} שונה מהסה״כ בחשבונית ${cur2(sub)}`);
  const issues=rows.filter(r=>r.why.length).length+extras.length+checks.length;
  return{rows,extras,sub,vat,expected,diff,checks,issues};}

function invVerdict(o,c){const ok=c.issues===0&&Math.abs(c.diff)<=1;
  return`<div class="verd ${ok?'v-ok':'v-bad'}"><b>${ok?'✅ החשבונית תואמת':'⚠️ '+(c.issues||1)+' פערים'}</b>
    <span style="color:var(--tx)">צפוי ${cur2(c.expected)} · בחשבונית ${cur2(c.sub)} · הפרש <b>${cur2(c.diff)}</b> (לפני מע״מ)</span></div>
    ${c.rows.filter(r=>r.why.length).map(r=>`<div class="oi" style="font-size:12px"><b>${esc(r.L.desc||r.L.sku)}</b> — ${esc(r.why.join(' · '))} <span style="color:var(--rd)">(${cur2(r.d)})</span></div>`).join('')}
    ${c.extras.map(l=>`<div class="oi" style="font-size:12px"><b>${esc(l.desc||l.sku)}</b> — לא הוזמן או לא אושר <span style="color:var(--rd)">(${cur2(ilTot(l))})</span></div>`).join('')}
    ${c.checks.map(x=>`<div class="oi" style="font-size:12px;color:var(--rd)">${esc(x)}</div>`).join('')}
    <div class="fg" style="margin-top:8px"><label>הערה</label><input type="text" value="${esc(ID.note)}" onchange="ID.note=this.value"></div>
    <div class="br"><button class="btn ${ok?'bg':'bo'} bs" onclick="saveInv('אושרה לתשלום')">${ok?'✓ אישור החשבונית לתשלום':'אישור לתשלום למרות הפערים'}</button>
      ${ok?'':`<button class="btn bd bs" onclick="saveInv('פערים לבירור')">שמירה כפערים לבירור</button><button class="btn bp bs" onclick="mailDispute()">📧 שליחת הפערים לספק</button>`}</div>`;}

async function saveRcv(){const o=getOrder(S.mo);if(!await reqAuth())return;
  const al=apprLines(o),rc=rcvInfo(o.id);if(RD.lines.every(d=>!num(d.qty))){toast('לא הוזנה אף כמות שהתקבלה','er');return;}
  showLd('שומר קבלת סחורה...');
  try{await ensureSheets();const link=await uploadFiles(RD.files,'תעודת_משלוח_'+o.id);const dt=RD.date?new Date(RD.date).toLocaleDateString('he-IL'):now(),by=S.user?.name||'';
    // Update the order's existing rows in place (cumulative received quantity); add rows only for lines that have none.
    const raw=await shRead(C.SH.RCV),rowOf=new Map();raw.forEach((r,ix)=>{if(ix&&(r[0]||'').trim()===o.id)rowOf.set(String(r[1]).trim(),ix+1);});
    const T="'"+C.SH.RCV+"'!",upd=[],add=[];
    al.forEach(L=>{const q=num(RD.lines.find(x=>x.i===L.i).qty),tot=(rc?(rc.q.get(L.i)||0):0)+q,rn=rowOf.get(String(L.i));
      if(!rn){add.push([o.id,L.i,q?dt:'',q?RD.no:'',o.supplier,o.project,L.sku,L.desc,L.qty,q?tot:'',F_GAP,F_ST,q?by:'',q?link:'',q?RD.note:'']);return;}
      if(!q)return;const old=raw[rn-1]||[],docs=[...new Set([old[3],RD.no].map(x=>(x||'').trim()).filter(Boolean))].join(', ');
      upd.push({range:`${T}C${rn}:D${rn}`,values:[[dt,docs]]},{range:`${T}J${rn}`,values:[[tot]]},
        {range:`${T}M${rn}:O${rn}`,values:[[by,[old[13],link].filter(Boolean).join(' '),[old[14],RD.note].filter(Boolean).join(' · ')]]});});
    if(upd.length)await shBatchVals(upd);if(add.length)await shWrite(C.SH.RCV,add);await syncAll(false);
    const st=stOf(o);await setOrderStatus(o.id,st).catch(()=>{});await refreshTracking().catch(e=>log('TRK:'+e.message));

  }catch(e){hideLd();toast(e.message,'er');}}

    c.extras.forEach(l=>rows.push([o.id,ID.no,ID.date,o.supplier,o.project,'',l.sku,l.desc,0,'',num(l.qty),0,num(l.price),0,r2(ilTot(l)),r2(ilTot(l)),'לא הוזמן',decision,by,at,link,ID.note]));

  📎 ההזמנה מצורפת כקובץ PDF.<br>נא לציין את מספר ההזמנה <b dir="ltr">${esc(o.id)}</b> בתעודת המשלוח ובחשבונית.</div></td></tr>

function textEmailHtml(id,title,msg){return emailShell(id,title,`<tr><td style="padding:26px 24px;font-size:15px;line-height:1.75;text-align:right">${mhtml(msg)}</td></tr>`);}
function orderMsg(o){const c=supContact(o.supplier);
  return`${c?'שלום '+c+',':'שלום רב,'}\n\nמצורפת הזמנת רכש עבור פרויקט ${o.project}.\nנבקש לאשר את קבלת ההזמנה ולתאם מועד אספקה.`;}
function orderPlain(o,msg){const items=isApproved(o)?apprLines(o):o.items;
  return msg+'\n\nהזמנה '+o.id+'\n'+items.map((it,i)=>`${i+1}. ${it.desc||it.sku} | מק"ט ${it.sku||'-'} | כמות ${it.qty} | ${cur2(it.qty*it.price)}`).join('\n')+'\n\nנא לציין את מספר ההזמנה בתעודת המשלוח ובחשבונית.\n\nבברכה,\n'+(S.user?.name||'')+'\nE.Z — לבנות חכם';}

function mailOrder(oid){const o=getOrder(oid);if(!o)return;mailModal({to:supEmail(o.supplier),subj:'הזמנת רכש '+o.id+' — '+o.project,msg:orderMsg(o),oid,pdf:true});}
function mailDispute(){const o=getOrder(S.mo);mailModal({to:supEmail(o.supplier),subj:`פערים בחשבונית ${ID.no||''} — הזמנה ${o.id}`,msg:disputeText(o,invCompare(o)),oid:o.id,pdf:false,title:'פערים בחשבונית'});}
let MD=null;
const mailHtml=msg=>MD.pdf?orderEmailHtml(getOrder(MD.oid),msg):textEmailHtml(MD.oid,MD.title||'',msg);
function mailModal(d){MD=d;oModal(`<h3>📧 שליחה לספק</h3>
  <div class="frow"><div class="fg"><label>אל</label><input type="text" id="mTo" dir="ltr" value="${esc(d.to)}" placeholder="supplier@example.com"></div>
    <div class="fg"><label>נושא</label><input type="text" id="mSu" value="${esc(d.subj)}"></div></div>
  <div class="fg"><label>ההודעה לספק</label><textarea id="mBo" style="min-height:${d.pdf?130:200}px" oninput="mailPrev()">${esc(d.msg)}</textarea></div>
  ${d.pdf?`<div class="note" style="margin-bottom:6px">📎 יצורף ${esc(d.oid)}.pdf, ועותק יישמר בתיקיית הדרייב.</div>`:''}
  <div class="fg"><label>כך הספק יראה את המייל</label><iframe id="mPrev" title="תצוגה מקדימה" style="width:100%;height:440px;border:1px solid var(--brd);border-radius:var(--r);background:#eef1f6"></iframe></div>
  <div class="br"><button class="btn bp" id="mSend" onclick="sendMailNow()">📤 שליחה מהג׳ימייל שלי</button><button class="btn bo bs" onclick="cModal()">לא עכשיו</button></div>`);mailPrev();}
function mailPrev(){const f=document.getElementById('mPrev');if(f)f.srcdoc=mailHtml(document.getElementById('mBo').value).replace('cid:ezlogo',LOGO);}
const b64u=s=>btoa(unescape(encodeURIComponent(s)));
const wrap76=s=>s.replace(/.{1,76}/g,'$&\r\n');
const blobB64=b=>fileB64(b);
async function sendMailNow(){const to=document.getElementById('mTo').value.trim(),subj=document.getElementById('mSu').value,msg=document.getElementById('mBo').value;
  if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(to)){toast('כתובת מייל לא תקינה','er');return;}
  if(!await reqAuth())return;const o=getOrder(MD.oid);showLd(MD.pdf?'יוצר PDF ושולח...':'שולח...');
  try{const mx='ezm'+Date.now(),rl='ezr'+Date.now(),al='eza'+Date.now();
    const plain=MD.pdf?orderPlain(o,msg):msg,html=mailHtml(msg);
    // multipart/mixed → [ multipart/related → [ multipart/alternative → [plain, html], logo ], PDF ]
    let mime=`To: ${to}\r\nSubject: =?UTF-8?B?${b64u(subj)}?=\r\nMIME-Version: 1.0\r\nContent-Type: multipart/mixed; boundary="${mx}"\r\n\r\n`+
      `--${mx}\r\nContent-Type: multipart/related; boundary="${rl}"\r\n\r\n`+
      `--${rl}\r\nContent-Type: multipart/alternative; boundary="${al}"\r\n\r\n`+
      `--${al}\r\nContent-Type: text/plain; charset="UTF-8"\r\nContent-Transfer-Encoding: base64\r\n\r\n${wrap76(b64u(plain))}\r\n`+
      `--${al}\r\nContent-Type: text/html; charset="UTF-8"\r\nContent-Transfer-Encoding: base64\r\n\r\n${wrap76(b64u(html))}\r\n--${al}--\r\n`+
      `--${rl}\r\nContent-Type: image/jpeg; name="logo.jpg"\r\nContent-ID: <ezlogo>\r\nContent-Disposition: inline; filename="logo.jpg"\r\nContent-Transfer-Encoding: base64\r\n\r\n${wrap76(LOGO.split(',')[1])}\r\n--${rl}--\r\n`;
    if(MD.pdf){const pdf=await orderPdf(o);
      mime+=`--${mx}\r\nContent-Type: application/pdf; name="${o.id}.pdf"\r\nContent-Disposition: attachment; filename="${o.id}.pdf"\r\nContent-Transfer-Encoding: base64\r\n\r\n${wrap76(await blobB64(pdf))}\r\n`;
      uploadToDrive(pdf,'הזמנה_'+o.id+'.pdf','application/pdf').then(l=>log('Drive: '+l)).catch(e=>log('Drive: '+e.message));}
    mime+=`--${mx}--`;
    const raw=btoa(mime).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
    await gfetch('https://gmail.googleapis.com/gmail/v1/users/me/messages/send',{method:'POST',body:JSON.stringify({raw})});
    hideLd();cModal();toast('✅ המייל נשלח ל-'+to,'ok');
  }catch(e){hideLd();toast(/הרשאה/.test(e.message)?'אין הרשאת שליחה מג׳ימייל. התנתקו והתחברו מחדש עם Google ואשרו שליחת מיילים.':e.message,'er');}}

// ===== SUPPLIERS =====
function supCard(s,nc,ec,tc,cc){const n=allOrders().filter(o=>o.supplier===s[nc]),bad=n.filter(o=>['פערים בחשבונית','התקבל חלקית'].includes(stOf(o))).length;
  return`<div class="card" style="padding:12px"><div style="display:flex;justify-content:space-between;gap:6px;flex-wrap:wrap"><div style="font-weight:700;font-size:14px">${esc(s[nc])}</div>
    <div>${n.length?`<span class="badge b-i">${n.length} הזמנות</span>`:''} ${bad?`<span class="badge b-r">${bad} עם פערים</span>`:''}</div></div>
    <div style="font-size:12px;color:var(--tx2);margin-top:4px">${s[cc]?'👤 '+esc(s[cc])+'<br>':''}${s[ec]?'📧 '+esc(s[ec])+'<br>':''}${s[tc]?'📞 '+esc(s[tc]):''}</div></div>`;}
function rSup(el){
  const sups=S.data.suppliers,nc=S.data.suppH[0]||'',ec=fh(S.data.suppH,['מייל','email']),tc=fh(S.data.suppH,['טלפון','phone']),cc=fh(S.data.suppH,['איש קשר','contact']);
  el.innerHTML=`<div class="card-t">🏢 ספקים <span class="sub">${sups.length}</span></div>
    <div class="fg"><input type="text" placeholder="🔍 חיפוש ספק..." oninput="filterSup(this.value)"></div>
    <div id="supList">${sups.map(s=>supCard(s,nc,ec,tc,cc)).join('')}</div>`;}
function filterSup(q){const list=document.getElementById('supList');if(!list)return;
  const nc=S.data.suppH[0]||'',ec=fh(S.data.suppH,['מייל']),tc=fh(S.data.suppH,['טלפון']),cc=fh(S.data.suppH,['איש קשר']),ql=q.toLowerCase();
  list.innerHTML=S.data.suppliers.filter(s=>(s[nc]||'').toLowerCase().includes(ql)).map(s=>supCard(s,nc,ec,tc,cc)).join('');}

// ===== PRODUCTS =====
function prodHtml(list){const{idC,dC,pC,sC}=prodCols();
  return list.slice(0,50).map(p=>`<div class="oi"><div style="display:flex;justify-content:space-between;gap:6px">
    <div><b style="font-size:12px">${esc(p[dC])}</b><br><span style="font-size:11px;color:var(--tx2)">מק״ט: ${esc(p[idC])} | ספק: ${esc(p[sC])}</span></div>
    <b style="color:var(--gn)">${cur2(p[pC])}</b></div></div>`).join('')+(list.length>50?`<div style="text-align:center;padding:10px;color:var(--tx3);font-size:12px">מציג 50 מתוך ${list.length}. חפשו לסינון.</div>`:'');}
function rProd(el){
  el.innerHTML=`<div class="card-t">🏷 מוצרים <span class="sub">${S.data.products.length}</span></div>
    <div class="fg"><input type="text" placeholder="🔍 חיפוש מוצר..." oninput="filterProd(this.value)"></div>
    <div id="prodList">${prodHtml(S.data.products)}</div>`;}
function filterProd(q){const list=document.getElementById('prodList');if(!list)return;const{idC,dC,sC}=prodCols(),ql=q.toLowerCase();
  list.innerHTML=prodHtml(S.data.products.filter(p=>(p[idC]||'').toLowerCase().includes(ql)||(p[dC]||'').toLowerCase().includes(ql)||(p[sC]||'').toLowerCase().includes(ql)));}

// INIT
function init(){load();checkOA();
  try{const ss=JSON.parse(localStorage.getItem('ez_ss'));if(ss?.email||ss?.gEmail){
    let users=S.data.users||[];if(!users.length)try{users=JSON.parse(localStorage.getItem('ez_usr'))||[];}catch(e){}
    const f=users.find(u=>u.email.toLowerCase()===(ss.email||ss.gEmail||'').toLowerCase());
    if(f){S.user={...ss,...f};if(S.gToken)reqAuth().then(updHdr).catch(()=>{});showApp();return;}}}catch(e){}
  const ge=localStorage.getItem('ez_ge');
  if(ge&&S.gToken){fetchGU(S.gToken);return;}
  document.getElementById('authP').style.display='flex';}
init();
</script>
