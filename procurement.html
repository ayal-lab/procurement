<!DOCTYPE html> 
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0a0e1a">
<title>E.Z — מערכת רכש</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;600;700;800;900&display=swap');
:root{--bg:#0a0e1a;--bg2:#111827;--bg3:#1e2538;--bg4:#2a3348;--brd:#2e3650;--tx:#eef0f6;--tx2:#94a3c0;--tx3:#5e6b85;
--bl:#2d7ff9;--bl2:#1a6be6;--bls:rgba(45,127,249,0.12);--gn:#10b981;--gns:rgba(16,185,129,0.12);
--or:#f59e0b;--ors:rgba(245,158,11,0.12);--rd:#ef4444;--rds:rgba(239,68,68,0.12);--pp:#8b5cf6;--r:10px}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Heebo',sans-serif;background:var(--bg);color:var(--tx);direction:rtl;min-height:100vh}
::-webkit-scrollbar{width:4px}::-webkit-scrollbar-thumb{background:var(--bg4);border-radius:2px}

.auth{display:flex;align-items:center;justify-content:center;min-height:100vh;padding:20px;background:linear-gradient(135deg,#0a0e1a,#111827)}
.auth-box{background:var(--bg2);border:1px solid var(--brd);border-radius:20px;padding:36px;width:100%;max-width:360px;text-align:center}
.auth-box img{width:90px;margin-bottom:16px;border-radius:10px}
.auth-box h1{font-size:22px;font-weight:800;margin-bottom:6px}
.auth-box p{color:var(--tx2);font-size:13px;margin-bottom:24px}
.gbtn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:13px;background:#fff;color:#333;border:none;border-radius:var(--r);font:600 15px 'Heebo';cursor:pointer}
.gbtn:hover{box-shadow:0 4px 16px rgba(255,255,255,0.1)}
.gbtn img{width:18px}
.aerr{color:var(--rd);font-size:12px;margin-top:14px;display:none;padding:10px;background:var(--rds);border-radius:var(--r);text-align:right;line-height:1.5}

.app{display:none;min-height:100vh;padding-bottom:64px}
.hdr{display:flex;align-items:center;gap:10px;padding:10px 14px;background:var(--bg2);border-bottom:1px solid var(--brd);position:sticky;top:0;z-index:50}
.hdr img{width:32px;border-radius:6px}
.hdr-t{font-size:14px;font-weight:700;flex:1}
.hdr-u{font-size:11px;color:var(--tx2);text-align:left;line-height:1.3}
.hdr-u b{color:var(--tx);font-size:12px}
.hbtn{background:none;border:1px solid var(--brd);color:var(--tx2);padding:5px 10px;border-radius:8px;font-size:11px;font-family:inherit;cursor:pointer}
.hdot{width:7px;height:7px;border-radius:50%;display:inline-block;margin-left:3px}
.dg{background:var(--gn)}.dr{background:var(--rd)}

.mc{padding:14px;max-width:880px;margin:0 auto}

.bnav{position:fixed;bottom:0;left:0;right:0;background:var(--bg2);border-top:1px solid var(--brd);display:flex;justify-content:space-evenly;padding:5px 4px env(safe-area-inset-bottom,5px);z-index:100}
.bt{display:flex;flex-direction:column;align-items:center;gap:1px;padding:4px 4px;color:var(--tx3);font-size:9px;cursor:pointer;flex:1;max-width:70px;-webkit-tap-highlight-color:transparent;position:relative}
.bt.active{color:var(--bl)}
.bt .bi{font-size:18px}
.bt-badge{background:var(--rd);color:#fff;font-size:8px;padding:1px 4px;border-radius:6px;position:absolute;top:0;right:calc(50% - 14px)}

.card{background:var(--bg2);border:1px solid var(--brd);border-radius:12px;padding:16px;margin-bottom:12px}
.card-t{font-size:14px;font-weight:700;margin-bottom:10px;display:flex;align-items:center;justify-content:space-between}
.card-t .sub{font-size:11px;color:var(--tx2);font-weight:400}

.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.st{background:var(--bg2);border:1px solid var(--brd);border-radius:12px;padding:14px 8px;text-align:center}
.st-v{font-size:20px;font-weight:800}.st-l{font-size:10px;color:var(--tx2);margin-top:2px}
.st.bl .st-v{color:var(--bl)}.st.gn .st-v{color:var(--gn)}.st.or .st-v{color:var(--or)}.st.rd .st-v{color:var(--rd)}

.fltr{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap}
.fltr select{flex:1;min-width:0;padding:9px;background:var(--bg3);border:1px solid var(--brd);border-radius:var(--r);color:var(--tx);font:14px 'Heebo'}

.prog{height:5px;background:var(--bg4);border-radius:3px;overflow:hidden;margin-top:3px}
.pf{height:100%;border-radius:3px}

.brow{padding:14px 0;border-bottom:1px solid var(--brd)}
.brow:last-child{border:none}
.brow-n{font-weight:600;font-size:14px;margin-bottom:8px}
.brow-d{display:flex;flex-wrap:wrap;gap:6px 20px;font-size:12px}
.brow-d .i{display:flex;flex-direction:column;align-items:center;min-width:55px}
.brow-d .v{font-weight:700;font-size:14px}.brow-d .l{font-size:9px;color:var(--tx3)}

.badge{display:inline-block;padding:2px 8px;border-radius:5px;font-size:10px;font-weight:600}
.b-p{background:var(--ors);color:var(--or)}.b-a{background:var(--gns);color:var(--gn)}.b-r{background:var(--rds);color:var(--rd)}

.fg{margin-bottom:12px}
.fg label{display:block;font-size:11px;color:var(--tx2);margin-bottom:3px;font-weight:500}
.fg select,.fg input,.fg textarea{width:100%;padding:9px 10px;background:var(--bg3);border:1px solid var(--brd);border-radius:var(--r);color:var(--tx);font:14px 'Heebo'}
.frow{display:grid;grid-template-columns:1fr 1fr;gap:8px}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:5px;padding:10px 18px;border:none;border-radius:var(--r);font:600 13px 'Heebo';cursor:pointer;width:100%;transition:all 0.15s}
.bp{background:var(--bl);color:#fff}.bg{background:var(--gn);color:#fff}.bd{background:var(--rd);color:#fff}
.bo{background:none;color:var(--tx2);border:1px solid var(--brd)}.bs{padding:7px 12px;font-size:11px;width:auto}
.br{display:flex;gap:6px;margin-top:10px}

.oi{background:var(--bg3);border-radius:var(--r);padding:10px;margin-bottom:6px}

.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,0.7);z-index:200;display:flex;align-items:center;justify-content:center;padding:10px;opacity:0;pointer-events:none;transition:opacity 0.2s}
.modal-bg.show{opacity:1;pointer-events:all}
.modal-bx{background:var(--bg2);border:1px solid var(--brd);border-radius:14px;width:100%;max-width:560px;max-height:85vh;overflow-y:auto;padding:18px}
.modal-bx h3{font-size:17px;font-weight:700;margin-bottom:12px}

.toast-c{position:fixed;top:10px;left:10px;right:10px;z-index:999;display:flex;flex-direction:column;align-items:center;gap:5px}
.toast{padding:10px 16px;border-radius:var(--r);font-size:12px;font-weight:500;max-width:380px;width:100%;text-align:center;animation:tI 0.3s}
.t-ok{background:var(--gn);color:#fff}.t-er{background:var(--rd);color:#fff}.t-in{background:var(--bl);color:#fff}
@keyframes tI{from{transform:translateY(-16px);opacity:0}to{transform:translateY(0);opacity:1}}

.ldg{position:fixed;inset:0;background:rgba(10,14,26,0.85);z-index:300;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:10px}
.spn{width:28px;height:28px;border:3px solid var(--brd);border-top-color:var(--bl);border-radius:50%;animation:sp 0.6s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}

.empty{text-align:center;padding:32px;color:var(--tx3)}.empty .ei{font-size:36px;margin-bottom:6px}

.chart-wrap{display:flex;justify-content:center;margin:12px 0}

@media(min-width:768px){.stats{grid-template-columns:repeat(4,1fr)}.frow{grid-template-columns:1fr 1fr}.mc{padding:20px}}
</style>
</head>

// GOOGLE AUTH
function gLogin(){const r=window.location.origin+window.location.pathname;
  window.location.href=`https://accounts.google.com/o/oauth2/v2/auth?client_id=${C.CID}&redirect_uri=${encodeURIComponent(r)}&response_type=token&scope=${encodeURIComponent(C.SCOPES)}&prompt=select_account`;}

function checkOA(){const h=window.location.hash;if(h.includes('access_token')){
  const p=new URLSearchParams(h.substring(1));const t=p.get('access_token');
  if(t){S.gToken=t;S.gAuth=true;save();window.history.replaceState(null,'',window.location.pathname);fetchGU(t);}}}

async function fetchGU(tok){try{const r=await fetch('https://www.googleapis.com/oauth2/v2/userinfo',{headers:{'Authorization':'Bearer '+tok}});
  if(r.ok){const u=await r.json();log('Google: '+u.email);localStorage.setItem('ez_ge',u.email);localStorage.setItem('ez_gn',u.name||'');tryLogin(u.email,u.name||u.email);}}catch(e){log('GU err:'+e.message);}}

async function tryLogin(email,name){
  log('tryLogin: '+email);let users=[];
  try{const uR=await shRead(C.SH.USR);
    if(uR.length>1){const hdr=uR[0].map(h=>(h||'').trim());
      const rows=uR.slice(1).map(r=>{const o={};hdr.forEach((h,i)=>{o[h]=(r[i]||'').trim();});return o;});
      users=rows.map(r=>({email:r['מייל']||r['email']||'',name:r['שם']||'',role:r['תפקיד']||'viewer',
        projects:Object.entries(r).filter(([k,v])=>k.includes('פרויקט')&&v&&v!=='הכל').map(([k,v])=>v.trim()).filter(Boolean),
        allProj:Object.values(r).some(v=>v==='הכל')})).filter(x=>x.email);
      S.data.users=users;localStorage.setItem('ez_usr',JSON.stringify(users));
      log('Users: '+users.map(u=>u.email+'('+u.role+')').join(', '));}}catch(e){log('USR err:'+e.message);
    try{users=JSON.parse(localStorage.getItem('ez_usr'))||[];}catch(e2){}}

  const f=users.find(u=>(u.email||'').toLowerCase().trim()===email.toLowerCase().trim());
  if(f){S.user={...f,gName:name,gEmail:email};localStorage.setItem('ez_ss',JSON.stringify(S.user));showApp();}
  else{const err=document.getElementById('aErr');err.style.display='block';
    err.innerHTML='<b>'+email+'</b> לא מורשה.<br>מיילים: '+users.map(u=>u.email).join(', ');}}

function handleG(){oModal(`<h3>🔗 Google</h3><p style="color:var(--tx2);margin-bottom:10px">${S.gAuth?'✅ מחובר':'🔴 לא מחובר'}</p>
  <div style="display:flex;flex-direction:column;gap:8px"><button class="btn bp" onclick="cModal();gLogin()">${S.gAuth?'החלף חשבון':'התחבר'}</button>
  ${S.gAuth?'<button class="btn bd" onclick="S.gToken=null;S.gAuth=false;save();cModal();toast(\'מנותק\');updHdr()">התנתק</button>':''}
  <button class="btn bo" onclick="cModal()">סגור</button></div>`);}

function logout(){S.user=null;localStorage.removeItem('ez_ss');document.getElementById('appP').style.display='none';document.getElementById('authP').style.display='flex';}

async function reqAuth(){if(!S.gToken){handleG();return false;}
  try{const r=await fetch('https://www.googleapis.com/oauth2/v1/tokeninfo?access_token='+S.gToken);if(r.ok){S.gAuth=true;return true;}}catch(e){}
  S.gAuth=false;S.gToken=null;save();oModal(`<h3>⚠️ פג תוקף</h3><p style="color:var(--tx2)">התחברו מחדש</p>
    <button class="btn bp" onclick="cModal();gLogin()">🔗 התחבר</button>`);return false;}

// SHEETS
async function shRead(n){const r=await fetch(`https://sheets.googleapis.com/v4/spreadsheets/${C.SID}/values/${encodeURIComponent("'"+n+"'")}?key=${C.KEY}`);
  if(!r.ok)throw new Error('קריאה: '+n);return(await r.json()).values||[];}

async function shWrite(n,v){if(!S.gToken)throw new Error('לא מחובר');
  const r=await fetch(`https://sheets.googleapis.com/v4/spreadsheets/${C.SID}/values/${encodeURIComponent("'"+n+"'!A1")}:append?valueInputOption=USER_ENTERED&insertDataOption=INSERT_ROWS`,
    {method:'POST',headers:{'Authorization':'Bearer '+S.gToken,'Content-Type':'application/json'},body:JSON.stringify({values:v})});
  if(!r.ok){if(r.status===401){S.gToken=null;S.gAuth=false;save();throw new Error('פג תוקף');}
    if(r.status===403)throw new Error('אין הרשאת עריכה');throw new Error('כתיבה נכשלה');}return r.json();}

async function shUpdate(n,range,v){if(!S.gToken)throw new Error('לא מחובר');
  await fetch(`https://sheets.googleapis.com/v4/spreadsheets/${C.SID}/values/${encodeURIComponent("'"+n+"'!"+range)}?valueInputOption=USER_ENTERED`,
    {method:'PUT',headers:{'Authorization':'Bearer '+S.gToken,'Content-Type':'application/json'},body:JSON.stringify({values:v})});}

// DRIVE — upload PDF
async function uploadToDrive(blob,fileName){
  const mimeType=fileName.endsWith('.html')?'text/html':'application/pdf';
  const meta=JSON.stringify({name:fileName,mimeType:mimeType,parents:[C.DRIVE_FOLDER]});
  const form=new FormData();
  form.append('metadata',new Blob([meta],{type:'application/json'}));
  form.append('file',blob);
  const r=await fetch('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id,webViewLink',
    {method:'POST',headers:{'Authorization':'Bearer '+S.gToken},body:form});
  if(!r.ok)throw new Error('העלאה לדרייב נכשלה');
  const f=await r.json();
  // Make viewable by anyone with link
  await fetch(`https://www.googleapis.com/drive/v3/files/${f.id}/permissions`,
    {method:'POST',headers:{'Authorization':'Bearer '+S.gToken,'Content-Type':'application/json'},
    body:JSON.stringify({role:'reader',type:'anyone'})}).catch(()=>{});
  return f.webViewLink||`https://drive.google.com/file/d/${f.id}/view`;}

  if(sl)showLd('מסנכרן...');
  try{
    const parse=(raw)=>{if(!raw?.length)return{h:[],rows:[]};const hdr=raw[0].map(x=>(x||'').trim());
      return{h:hdr,rows:raw.slice(1).map(r=>{const o={};hdr.forEach((h,i)=>{o[h]=(r[i]||'').trim();});return o;})};};
    const[sR,pR,bR,oR,aR]=await Promise.all([shRead(C.SH.SUP).catch(()=>[]),shRead(C.SH.PROD).catch(()=>[]),
      shRead(C.SH.BUD).catch(()=>[]),shRead(C.SH.ORD).catch(()=>[]),shRead(C.SH.APP).catch(()=>[])]);
    const s=parse(sR),p=parse(pR),b=parse(bR),o=parse(oR),a=parse(aR);
    S.data.suppH=s.h;S.data.suppliers=s.rows;S.data.prodH=p.h;S.data.products=p.rows;
    S.data.budH=b.h;S.data.budget=b.rows;if(o.rows.length)S.data.orders=o.rows;if(a.rows.length)S.data.approved=a.rows;
    const ps=new Set();b.rows.forEach(r=>{for(const[k,v] of Object.entries(r))if(k.includes('פרויקט')&&v)ps.add(v);});
    if(!ps.size)['נוף הגלעד 11','נוף הגלעד 18','נוף הדגן אלון מורה','עדן 21','בזלת 16','גבעת סלעית מחולה','האופק 32 ירוחם','האופק 36 ירוחם','צורים'].forEach(x=>ps.add(x));
    S.data.projects=[...ps];save();
    if(sl){hideLd();toast('סנכרון ✅','ok');}
  }catch(e){if(sl)hideLd();toast(e.message,'er');log('SYNC:'+e.message);}
  render();}

const fh=(h,ns)=>{for(const n of ns){const f=h.find(x=>x===n);if(f)return f;}for(const n of ns){const f=h.find(x=>x.includes(n));if(f)return f;}return h[0]||'';};
const fmt=n=>(parseFloat(n)||0).toLocaleString('he-IL',{maximumFractionDigits:0});
const cur=n=>'₪'+fmt(n);
const gid=()=>{const d=new Date();return`PO-${d.getFullYear().toString().slice(2)}${String(d.getMonth()+1).padStart(2,'0')}${String(d.getDate()).padStart(2,'0')}-${Math.floor(Math.random()*900+100)}`;};
const now=()=>{const d=new Date();return d.toLocaleDateString('he-IL')+' '+d.toLocaleTimeString('he-IL',{hour:'2-digit',minute:'2-digit'});};
const toast=(m,t='in')=>{const c=document.getElementById('TC'),el=document.createElement('div');el.className='toast t-'+({ok:'ok',er:'er'}[t]||'in');el.textContent=m;c.appendChild(el);setTimeout(()=>{el.remove();},3500);};

// Budget helpers
const budDom=r=>fc(r,['תחום','שם סעיף','סעיף']);
const budSub=r=>fc(r,['תת תחום','תת_תחום']);
const budProj=r=>fc(r,['פרויקט']);
const budAmt=r=>{let v=fc(r,['מחיר','תקציב','סכום']);if(v)return parseFloat(String(v).replace(/[₪,]/g,''))||0;
  for(const k of[...Object.keys(r)].reverse()){const n=parseFloat(String(r[k]).replace(/[₪,]/g,''));if(!isNaN(n)&&n>0)return n;}return 0;};
const budForProj=p=>S.data.budget.filter(b=>budProj(b)===p);
const domSummary=proj=>{const rows=budForProj(proj),d=new Map();rows.forEach(r=>{const nm=budDom(r),amt=budAmt(r);if(!nm)return;
  if(!d.has(nm))d.set(nm,{name:nm,budget:0,subs:[]});const e=d.get(nm);e.budget+=amt;e.subs.push({sub:budSub(r)||'כללי',amt});});return[...d.values()];};

const supEmail=name=>{const nc=S.data.suppH[0]||'',ec=fh(S.data.suppH,['מייל','email']);
  const s=S.data.suppliers.find(x=>(x[nc]||'').trim()===name.trim())||S.data.suppliers.find(x=>(x[nc]||'').includes(name));return s?(s[ec]||''):'';};
const supContact=name=>{const nc=S.data.suppH[0]||'',cc=fh(S.data.suppH,['איש קשר','contact']);
  const s=S.data.suppliers.find(x=>(x[nc]||'').trim()===name.trim());return s?(s[cc]||''):'';};

const rowAmt=r=>{for(const n of['סהכ','סכום','total'])for(const k of Object.keys(r))if(k.includes(n)){
  const v=parseFloat(String(r[k]).replace(/[₪,]/g,''));if(!isNaN(v)&&v>0)return v;}return 0;};
const appTotal=(proj,dom)=>{let t=0;const c=new Set();(S.data.approved||[]).forEach(r=>{const id=r['מספר הזמנה'];if(c.has(id))return;
  if(r['פרויקט']!==proj)return;if(dom&&r['תחום']!==dom)return;c.add(id);t+=rowAmt(r);});return t;};

const allOrders=()=>{const m=new Map(),del=getDel();
  (S.data.orders||[]).forEach(r=>{const id=r['מספר הזמנה'];if(!id||del.includes(id))return;if(!m.has(id))m.set(id,{...r,_it:[]});m.get(id)._it.push(r);});
  getLO().forEach(o=>{const id=o['מספר הזמנה'];if(id&&!del.includes(id))m.set(id,o);});return[...m.values()];};
const orderItems=o=>{if(o.items&&Array.isArray(o.items))return o.items;if(o._it)return o._it.map(r=>({id:r['מקט']||'',desc:r['תיאור מוצר']||r['תיאור']||'',qty:parseInt(r['כמות'])||0,price:parseFloat(r['מחיר ליחידה'])||0,total:parseFloat(r['סהכ שורה'])||0}));return[];};

      if(!acked[key])alerts.push({domain:d.name,pct:p,threshold:th,key,budget:d.budget,used:u});}});});

function rOI(){const c=document.getElementById('OIC');if(!c)return;

      <option value="custom" ${it.pid==='custom'?'selected':''}>✏️ חופשי</option></select>
      ${it.pid==='custom'?`<input type="text" placeholder="תיאור" value="${it.desc||''}" onchange="uOI(${i},'desc',this.value)" style="width:100%;margin-bottom:4px;padding:7px;background:var(--bg);border:1px solid var(--brd);border-radius:var(--r);color:var(--tx);font-size:13px">`:''}

        <span style="color:var(--tx2)">כמות:</span><input type="number" min="1" value="${it.qty}" onchange="uOI(${i},'qty',this.value)" style="width:55px;padding:5px;background:var(--bg);border:1px solid var(--brd);border-radius:6px;color:var(--tx);text-align:center;font-size:13px">

        <span style="cursor:pointer;color:var(--rd)" onclick="remOI(${i})">✕</span></div></div>`;});

function uOI(i,f,v){oi[i][f]=v;if(f==='pid'&&v!=='custom'&&v!==''){const h=S.data.prodH,idC=fh(h,['מק_ט','מק_ס','מקט']),dC=fh(h,['תאור_מוצר','תיאור']),pC=fh(h,['מחיר ליחידה','מחיר']);
  const p=S.data.products.find(x=>(x[idC]||'')===v);if(p){oi[i].price=parseFloat(p[pC])||0;oi[i].desc=p[dC]||'';}}rOI();}

function remOI(i){if(oi.length<=1)return;oi.splice(i,1);rOI();}
function uTot(){let s=0;oi.forEach(it=>{s+=(parseFloat(it.price)||0)*(parseInt(it.qty)||0);});const v=s*C.VAT,t=s+v;

async function submitOrd(){
  if(!await reqAuth())return;
  const sup=document.getElementById('oS').value,proj=document.getElementById('oP').value,dom=document.getElementById('oD').value,sub=document.getElementById('oSD').value,notes=document.getElementById('oN').value;
  if(!sup){toast('בחרו ספק','er');return;}if(!proj){toast('בחרו פרויקט','er');return;}
  if(oi.every(i=>!i.pid)){toast('הוסיפו מוצר','er');return;}
  let st=0;const items=[];
  oi.forEach(it=>{if(!it.pid)return;const l=(parseFloat(it.price)||0)*(parseInt(it.qty)||0);st+=l;
    items.push({id:it.pid==='custom'?'חופשי':it.pid,desc:it.desc||it.pid,qty:parseInt(it.qty),price:parseFloat(it.price),total:l});});
  const vat=st*C.VAT,total=st+vat,oid=gid();
  const order={'מספר הזמנה':oid,'תאריך':now(),'ספק':sup,'פרויקט':proj,'תחום':dom,'תת תחום':sub,
    'יוצר':S.user?.name||S.user?.gName||'','סטטוס':'ממתין לאישור','סהכ הזמנה לפני מעמ':st,'מעמ':vat,'סהכ הזמנה כולל מעמ':total,'הערות':notes,items};

  showLd('שומר...');
  try{const ex=await shRead(C.SH.ORD).catch(()=>[]);if(!ex.length)await shWrite(C.SH.ORD,[OH]);
    const rows=items.map(it=>OH.map(h=>{switch(h){case 'מספר הזמנה':return oid;case 'תאריך':return now();case 'ספק':return sup;case 'פרויקט':return proj;
      case 'תחום':return dom;case 'תת תחום':return sub;case 'יוצר':return order['יוצר'];case 'סטטוס':return 'ממתין לאישור';
      case 'מקט':return it.id;case 'תיאור מוצר':return it.desc;case 'כמות':return String(it.qty);case 'מחיר ליחידה':return String(it.price);
      case 'סהכ שורה':return String(it.total);case 'סהכ הזמנה לפני מעמ':return String(st);case 'מעמ':return String(vat);
      case 'סהכ הזמנה כולל מעמ':return String(total);case 'הערות':return notes;default:return '';}}));
    await shWrite(C.SH.ORD,rows);const lo=getLO();lo.push(order);saveLO(lo);hideLd();toast('✅ נשמר','ok');
    sendMail(order);oi=[{pid:'',qty:1,price:0,desc:''}];navigate('ord');
  }catch(e){hideLd();toast(e.message,'er');}}

async function doApp(oid,n){if(!canApprove()){toast('אין הרשאה','er');return;}
  if(!await reqAuth())return;if(!confirm('לאשר '+oid+'?'))return;
  const ords=getLO(),o=ords.find(x=>x['מספר הזמנה']===oid);if(!o){toast('לא נמצא','er');return;}
  const items=o.items||[];const approved=[];
  for(let i=0;i<n;i++){const ck=document.getElementById('ac_'+oid+'_'+i)?.checked;const q=parseInt(document.getElementById('aq_'+oid+'_'+i)?.value)||0;
    if(ck&&q>0)approved.push({...items[i],aq:q,total:q*(parseFloat(items[i]?.price)||0)});}
  if(!approved.length){toast('לא אושר שום פריט','er');return;}
  let sb=0;approved.forEach(it=>sb+=it.total);const vat=sb*C.VAT,total=sb+vat;
  o['סטטוס']='מאושר';o['מאשר']=S.user?.name||'';o['תאריך אישור']=now();saveLO(ords);

  showLd('מאשר...');
  try{const ex=await shRead(C.SH.APP).catch(()=>[]);if(!ex.length)await shWrite(C.SH.APP,[AH]);
    const rows=approved.map(it=>AH.map(h=>{switch(h){
      case 'מספר הזמנה':return oid;case 'תאריך':return o['תאריך'];case 'ספק':return o['ספק'];case 'פרויקט':return o['פרויקט'];
      case 'תחום':return o['תחום']||'';case 'תת תחום':return o['תת תחום']||'';case 'יוצר':return o['יוצר']||'';case 'סטטוס':return 'מאושר';
      case 'מקט':return it.id||'';case 'תיאור מוצר':return it.desc||'';case 'כמות':return String(it.aq||it.qty);
      case 'מחיר ליחידה':return String(it.price||0);case 'סהכ שורה':return String(it.total);
      case 'סהכ הזמנה לפני מעמ':return String(sb);case 'מעמ':return String(vat);case 'סהכ הזמנה כולל מעמ':return String(total);
      case 'הערות':return o['הערות']||'';case 'מאשר':return S.user?.name||'';case 'תאריך אישור':return now();default:return '';}}));
    await shWrite(C.SH.APP,rows);
    // Update status in orders sheet column H
    try{const ordData=await shRead(C.SH.ORD);for(let i=1;i<ordData.length;i++){if((ordData[i][0]||'')===oid){await shUpdate(C.SH.ORD,'H'+(i+1),[['מאושר']]);break;}}}catch(e){}
    hideLd();toast('✅ אושר','ok');
  }catch(e){hideLd();toast(e.message,'er');}render();}

function doRej(oid){if(!canApprove()){toast('אין הרשאה','er');return;}if(!confirm('לדחות?'))return;
  const o=getLO(),x=o.find(y=>y['מספר הזמנה']===oid);if(x){x['סטטוס']='נדחה';saveLO(o);}
  shRead(C.SH.ORD).then(d=>{for(let i=1;i<d.length;i++){if((d[i][0]||'')===oid){shUpdate(C.SH.ORD,'H'+(i+1),[['נדחה']]).catch(()=>{});break;}}}).catch(()=>{});
  toast('נדחה');render();}

  const items=orderItems(o),email=supEmail(o['ספק']),contact=supContact(o['ספק']);
  const total=o['סהכ הזמנה כולל מעמ']||0,sb=o['סהכ הזמנה לפני מעמ']||0,vat=total-sb;
  const oid=o['מספר הזמנה'],subj='הזמנת רכש '+oid+' — '+o['פרויקט'];

  showLd('מעלה הזמנה לדרייב...');
  let driveLink='';
  try{const htmlBlob=genOrderDoc(o,items);driveLink=await uploadToDrive(htmlBlob,'הזמנה_'+oid+'.html');log('Drive: '+driveLink);}catch(e){log('Drive err: '+e.message);}
  hideLd();

  const greeting=contact?'שלום '+contact+',':'שלום רב,';
  let body=greeting+'\n\nמצו"ב הזמנת רכש '+oid+'\nתאריך: '+o['תאריך']+'\nפרויקט: '+o['פרויקט'];
  if(o['תחום'])body+='\nתחום: '+o['תחום'];if(o['תת תחום'])body+='\nתת תחום: '+o['תת תחום'];body+='\n\n';
  items.forEach((it,i)=>{body+=(i+1)+'. '+(it.desc||it.id)+'\n   מק"ט: '+(it.id||'')+' | כמות: '+it.qty+' | מחיר: '+cur(it.price||0)+' | סה"כ: '+cur(it.total||0)+'\n\n';});
  body+='סה"כ כולל מע"מ: '+cur(total)+'\n';
  if(driveLink)body+='\n📄 הזמנה מפורטת:\n'+driveLink+'\n';
  body+='\nבברכה,\n'+(S.user?.name||'')+'\nE.Z — לבנות חכם';
  cModal();
  window.location.href='mailto:'+(email||'')+'?subject='+encodeURIComponent(subj)+'&body='+encodeURIComponent(body);
  if(driveLink)toast('הועלה לדרייב + נפתח מייל ✅','ok');
}

function genOrderDoc(o,items){
  const total=o['סהכ הזמנה כולל מעמ']||0,sb=o['סהכ הזמנה לפני מעמ']||0,vat=total-sb;
  const logoSrc=document.getElementById('logoImg')?.src||'';
  const html=`<!DOCTYPE html><html dir="rtl"><head><meta charset="UTF-8">
    <style>@import url('https://fonts.googleapis.com/css2?family=Heebo:wght@400;600;700&display=swap');
    *{margin:0;padding:0;box-sizing:border-box}body{font-family:'Heebo',sans-serif;padding:28px;direction:rtl;color:#1a1a2e}
    .hdr{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px;padding-bottom:14px;border-bottom:3px solid #2d7ff9}
    .hdr img{width:70px;border-radius:8px}.hdr h1{font-size:20px;color:#2d7ff9}
    .det{display:grid;grid-template-columns:1fr 1fr;gap:5px;margin-bottom:14px;font-size:13px}.det b{color:#2d7ff9}
    table{width:100%;border-collapse:collapse;margin-bottom:14px}th{background:#2d7ff9;color:#fff;padding:8px;text-align:right;font-size:12px}
    td{padding:8px;border-bottom:1px solid #e2e8f0;font-size:13px}tr:nth-child(even){background:#f8fafc}
    .tot{text-align:left;margin-top:10px}.tot .big{font-size:20px;font-weight:700;color:#2d7ff9;margin-top:4px}
    .ft{text-align:center;margin-top:24px;color:#9da3b4;font-size:10px;border-top:1px solid #e2e8f0;padding-top:10px}
    @media print{@page{size:A4;margin:15mm}}</style></head><body>
    <div class="hdr"><div>${logoSrc?'<img src="'+logoSrc+'">':''}<h1>הזמנת רכש</h1></div>
      <div style="text-align:left;font-size:13px;color:#6b7185">${o['מספר הזמנה']}<br>${o['תאריך']||''}</div></div>
    <div class="det"><div><b>ספק:</b> ${o['ספק']||''}</div><div><b>פרויקט:</b> ${o['פרויקט']||''}</div>
      <div><b>יוצר:</b> ${o['יוצר']||''}</div><div>${o['תחום']?'<b>תחום:</b> '+o['תחום']:''}</div></div>
    <table><thead><tr><th>מק״ט</th><th>מוצר</th><th>כמות</th><th>מחיר</th><th>סה״כ</th></tr></thead>
      <tbody>${items.map(it=>`<tr><td>${it.id||''}</td><td>${it.desc||''}</td><td>${it.qty}</td><td>${cur(it.price||0)}</td><td style="font-weight:600">${cur(it.total||0)}</td></tr>`).join('')}</tbody></table>
    <div class="tot"><div>לפני מע"מ: ${cur(sb)}</div><div>מע"מ 18%: ${cur(vat)}</div><div class="big">סה"כ כולל מע"מ: ${cur(total)}</div></div>
    <div class="ft">E.Z — לבנות חכם</div></body></html>`;
  return new Blob([html],{type:'text/html'});}

function printOrder(oid){const o=allOrders().find(x=>x['מספר הזמנה']===oid);if(!o)return;
  const blob=genOrderDoc(o,orderItems(o));const url=URL.createObjectURL(blob);
  const w=window.open(url,'_blank');setTimeout(()=>w.print(),800);}

// INIT
function init(){load();checkOA();
  try{const ss=JSON.parse(localStorage.getItem('ez_ss'));if(ss?.email||ss?.gEmail){
    let users=S.data.users||[];if(!users.length)try{users=JSON.parse(localStorage.getItem('ez_usr'))||[];}catch(e){}
    const f=users.find(u=>u.email.toLowerCase()===(ss.email||ss.gEmail||'').toLowerCase());
    if(f){S.user={...ss,...f};if(S.gToken)reqAuth().catch(()=>{});showApp();return;}}}catch(e){}
  const ge=localStorage.getItem('ez_ge');
  if(ge&&S.gToken){fetchGU(S.gToken);return;}
  document.getElementById('authP').style.display='flex';}
init();
</script>
